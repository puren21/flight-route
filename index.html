<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>비행경로</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #map { width: 100%; height: 100%; }
    .panel { position:absolute; top:16px; left:16px; z-index:10; width:220px; padding:14px; background:rgba(255,255,255,.96); border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.18); }
    .panel h1 { margin:0; font-size:18px; }
    .panel-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }
    .panel-toggle {
      flex:0 0 auto;
      width:34px;
      height:34px;
      padding:0;
      border-radius:8px;
      font-size:18px;
      font-weight:700;
      line-height:1;
    }
    .panel-body { display:block; }
    .route-number-wrap {
      margin: 8px 0 10px;
    }
    .route-number-wrap label {
      display:block;
      font-size:12px;
      color:#555;
      margin-bottom:4px;
    }
    .route-number-select {
      width:100%;
      padding:7px 8px;
      border:1px solid #ccc;
      border-radius:7px;
      background:#fff;
      font-size:13px;
    }
    .panel.collapsed {
      width:auto;
      min-width:0;
      padding:10px 12px;
    }
    .panel.collapsed .panel-header {
      margin-bottom:0;
    }
    .panel.collapsed .panel-body {
      display:none;
    }
    .panel.collapsed h1 {
      font-size:16px;
    }
    .row { display:flex; gap:8px; margin-top:8px; }
    button { flex:1; border:0; border-radius:8px; padding:9px 10px; background:#f1f3f5; cursor:pointer; font-size:14px; }
    button:hover { background:#e9ecef; }
    button.active { background:#222; color:#fff; }
    .toggle { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; }
    .status { margin-top:10px; font-size:12px; line-height:1.5; color:#555; }
    .floating-location {
      position: absolute;
      right: 14px;
      bottom: 56px;
      z-index: 12;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(0,0,0,.18);
      border-radius: 22px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
      font-size: 20px;
      line-height: 44px;
      text-align: center;
      cursor: pointer;
      color: #222;
    }
    .floating-location:hover { background: #fff; }
    .route-select-popup {
      width: 150px;
      padding: 10px;
      background: rgba(255,255,255,.98);
      border-radius: 10px;
      box-shadow: 0 3px 14px rgba(0,0,0,.28);
      font-size: 13px;
      color: #222;
    }
    .route-select-popup .route-select-title {
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }
    .route-select-popup .route-select-actions {
      display: flex;
      gap: 6px;
    }
    .route-select-popup button {
      flex: 1;
      padding: 8px 6px;
      border: 0;
      border-radius: 7px;
      font-weight: 700;
      cursor: pointer;
    }
    .route-select-popup .route-on-btn {
      background: #1976d2;
      color: #fff;
    }
    .route-select-popup .route-off-btn {
      background: #e9ecef;
      color: #222;
    }
    .address-popup {
      width: 250px;
      padding: 12px;
      background: rgba(255,255,255,.98);
      border-radius: 10px;
      box-shadow: 0 3px 14px rgba(0,0,0,.28);
      color: #222;
      font-size: 13px;
      line-height: 1.45;
    }
    .address-popup .title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 5px;
    }
    .address-popup .addr {
      word-break: keep-all;
    }
    .address-popup .coord {
      margin-top: 4px;
      color: #777;
      font-size: 11px;
    }
    .address-popup .route-actions {
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-top:9px;
    }
    .address-popup .route-actions button {
      width:100%;
      margin-top:0;
    }
    .address-popup .navi-btn {
      width: 100%;
      margin-top: 0;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      background: #fee500;
      color: #191919;
      font-weight: 700;
      cursor: pointer;
    }
    .address-popup .naver-btn {
      width: 100%;
      margin-top: 0;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      background: #03c75a;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .address-popup .close-btn {
      position: absolute;
      right: 8px;
      top: 6px;
      border: 0;
      background: transparent;
      padding: 2px 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .scale-bar {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 10;
      min-width: 70px;
      padding: 3px 8px 2px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(0,0,0,.45);
      border-top: 0;
      color: #222;
      font-size: 11px;
      text-align: center;
      line-height: 1.2;
      pointer-events: none;
    }
    .scale-bar::before {
      content: "";
      position: absolute;
      left: -1px;
      right: -1px;
      top: 0;
      border-top: 2px solid #222;
    }
    .route-label {
      color: #111;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      text-shadow:
        -1px -1px 0 rgba(255,255,255,.95),
         1px -1px 0 rgba(255,255,255,.95),
        -1px  1px 0 rgba(255,255,255,.95),
         1px  1px 0 rgba(255,255,255,.95);
      transform: translate(-50%, -50%);
    }
    @media (max-width:700px) {
      .panel { top:10px; left:10px; right:10px; width:auto; padding:10px; }
      .panel h1 { font-size:16px; }
      .panel.collapsed { right:auto; width:auto; }
      button { padding:8px 6px; font-size:13px; }
      .status { font-size:11px; }
    }
  </style>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7ee4bab8cd4d6be6d0d68a49e9b4502b&libraries=services"></script>
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="비행경로">
  <link rel="apple-touch-icon" href="./icon.svg">
</head>
<body>
<div id="map"></div>
<div id="scaleBar" class="scale-bar">축척 계산 중...</div>
<button id="floatingLocBtn" class="floating-location" type="button" title="현재 위치" aria-label="현재 위치">◎</button>
<div class="panel collapsed" id="controlPanel">
  <div class="panel-header">
    <h1>비행경로</h1>
    <button id="panelToggleBtn" class="panel-toggle" type="button" aria-label="메뉴 펼치기">＋</button>
  </div>
  <div class="panel-body">
    <label class="toggle"><input type="checkbox" id="routeToggle" checked /> 비행경로 표시</label>
    <div class="route-number-wrap">
      <label for="routeNumberSelect">번호 선택</label>
      <select id="routeNumberSelect" class="route-number-select">
        <option value="">번호 선택</option>
      </select>
    </div>
    <div style="font-size:11px;color:#666;margin:4px 0 8px;">라인 선택: 켜기 / 끄기</div>
    <div class="row"><button id="roadBtn" class="active">일반지도</button><button id="skyBtn">위성지도</button></div>
    <div class="row"><button id="zoomInBtn">확대 +</button><button id="zoomOutBtn">축소 −</button></div>
    <div class="row"><button id="fitBtn">전체 경로</button><button id="locBtn">현재 위치</button></div>
    <div class="status" id="status">GeoJSON 불러오는 중...</div>
  </div>
</div>
<script>
const map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(35.16,126.84),level:8});

let routePolylines=[],routeLabels=[],routeBounds=new kakao.maps.LatLngBounds(),currentMarker=null;
const routeIndex=new Map();
let selectedRoute=null;
let routeSelectOverlay=null;
let routePopupOpenedAt=0;
const statusEl=document.getElementById('status'),routeToggle=document.getElementById('routeToggle');
const controlPanel=document.getElementById('controlPanel');
const panelToggleBtn=document.getElementById('panelToggleBtn');

panelToggleBtn.addEventListener('click',()=>{
  const collapsed=controlPanel.classList.toggle('collapsed');
  panelToggleBtn.textContent=collapsed?'＋':'−';
  panelToggleBtn.setAttribute('aria-label',collapsed?'메뉴 펼치기':'메뉴 접기');
});
const geocoder=new kakao.maps.services.Geocoder();
let addressOverlay=null;

if(window.Kakao && !Kakao.isInitialized()){
  Kakao.init('7ee4bab8cd4d6be6d0d68a49e9b4502b');
}
function setRouteState(routeLine,enabled){
  routeLine._routeEnabled=enabled;

  if(enabled){
    routeLine.setOptions({
      strokeWeight:3,
      strokeColor:'#E53935',
      strokeOpacity:.9
    });
  }else{
    routeLine.setOptions({
      strokeWeight:1.5,
      strokeColor:'#1976D2',
      strokeOpacity:.5
    });
  }

  if(routeLine._labelOverlay){
    const showLabel=enabled && routeToggle.checked && map.getLevel()<=8;
    routeLine._labelOverlay.setMap(showLabel?map:null);
  }
}

function closeRouteSelectPopup(){
  if(routeSelectOverlay){
    routeSelectOverlay.setMap(null);
    routeSelectOverlay=null;
  }
}

function showRouteSelectPopup(routeLine,position){
  closeRouteSelectPopup();

  const box=document.createElement('div');
  box.className='route-select-popup';

  const title=document.createElement('div');
  title.className='route-select-title';
  title.textContent='라인 표시 · '+(routeLine._routeNumber || '번호 없음');

  const actions=document.createElement('div');
  actions.className='route-select-actions';

  const onBtn=document.createElement('button');
  onBtn.className='route-on-btn';
  onBtn.type='button';
  onBtn.textContent='켜기';
  onBtn.addEventListener('click',()=>{
    setRouteState(routeLine,true);
    if(routeSelectOverlay){
      routeSelectOverlay.setMap(null);
      routeSelectOverlay=null;
    }
  });

  const offBtn=document.createElement('button');
  offBtn.className='route-off-btn';
  offBtn.type='button';
  offBtn.textContent='끄기';
  offBtn.addEventListener('click',()=>{
    setRouteState(routeLine,false);
    if(routeSelectOverlay){
      routeSelectOverlay.setMap(null);
      routeSelectOverlay=null;
    }
  });

  actions.appendChild(onBtn);
  actions.appendChild(offBtn);
  box.appendChild(title);
  box.appendChild(actions);

  routePopupOpenedAt=Date.now();
  routeSelectOverlay=new kakao.maps.CustomOverlay({
    map:map,
    position:position,
    content:box,
    xAnchor:0.5,
    yAnchor:1.15,
    zIndex:40
  });
}

function startKakaoNavi(name,lat,lng){
  if(!window.Kakao || !Kakao.isInitialized() || !Kakao.Navi){
    alert('카카오내비 연결을 준비하지 못했습니다.');
    return;
  }

  Kakao.Navi.start({
    name: name || '선택 위치',
    x: lng,
    y: lat,
    coordType: 'wgs84'
  });
}

function startNaverMapRoute(name,lat,lng){
  const appName=encodeURIComponent(window.location.origin + window.location.pathname);
  const destinationName=encodeURIComponent(name || '선택 위치');
  const url='nmap://route/car?dlat='+lat+
    '&dlng='+lng+
    '&dname='+destinationName+
    '&appname='+appName;

  window.location.href=url;
}

function showAddressPopup(latLng){
  const lat=latLng.getLat();
  const lng=latLng.getLng();

  geocoder.coord2Address(lng,lat,function(result,status){
    let jibun='지번 정보를 찾을 수 없습니다.';

    if(status===kakao.maps.services.Status.OK && result && result[0]){
      if(result[0].address && result[0].address.address_name){
        jibun=result[0].address.address_name;
      }else if(result[0].road_address && result[0].road_address.address_name){
        jibun=result[0].road_address.address_name;
      }
    }

    if(addressOverlay){
      addressOverlay.setMap(null);
      addressOverlay=null;
    }

    const box=document.createElement('div');
    box.className='address-popup';

    const close=document.createElement('button');
    close.className='close-btn';
    close.type='button';
    close.textContent='×';

    const title=document.createElement('div');
    title.className='title';
    title.textContent='지번 정보';

    const addr=document.createElement('div');
    addr.className='addr';
    addr.textContent=jibun;

    const coord=document.createElement('div');
    coord.className='coord';
    coord.textContent=lat.toFixed(6)+', '+lng.toFixed(6);

    const navi=document.createElement('button');
    navi.className='navi-btn';
    navi.type='button';
    navi.textContent='카카오내비 길찾기';
    navi.addEventListener('click',()=>startKakaoNavi(jibun,lat,lng));

    const naver=document.createElement('button');
    naver.className='naver-btn';
    naver.type='button';
    naver.textContent='네이버지도 길찾기';
    naver.addEventListener('click',()=>startNaverMapRoute(jibun,lat,lng));

    close.addEventListener('click',()=>{
      if(addressOverlay){
        addressOverlay.setMap(null);
        addressOverlay=null;
      }
    });

    box.appendChild(close);
    box.appendChild(title);
    box.appendChild(addr);
    box.appendChild(coord);
    const routeActions=document.createElement('div');
    routeActions.className='route-actions';
    routeActions.appendChild(naver);
    routeActions.appendChild(navi);
    box.appendChild(routeActions);

    addressOverlay=new kakao.maps.CustomOverlay({
      map:map,
      position:latLng,
      content:box,
      xAnchor:0.5,
      yAnchor:1.08,
      zIndex:30
    });
  });
}

kakao.maps.event.addListener(map,'click',function(){
  if(routeSelectOverlay && Date.now()-routePopupOpenedAt>250){
    closeRouteSelectPopup();
  }
});

kakao.maps.event.addListener(map,'rightclick',function(mouseEvent){
  showAddressPopup(mouseEvent.latLng);
});

function niceScaleDistance(meters){
  const exponent=Math.pow(10,Math.floor(Math.log10(meters)));
  const fraction=meters/exponent;
  let niceFraction;
  if(fraction>=5) niceFraction=5;
  else if(fraction>=2) niceFraction=2;
  else niceFraction=1;
  return niceFraction*exponent;
}

function updateScaleBar(){
  const scaleBar=document.getElementById('scaleBar');
  if(!scaleBar) return;

  const center=map.getCenter();
  const projection=map.getProjection();
  if(!projection) return;

  const centerPoint=projection.containerPointFromCoords(center);
  const targetPoint=new kakao.maps.Point(centerPoint.x+100,centerPoint.y);
  const targetCoord=projection.coordsFromContainerPoint(targetPoint);

  const line=new kakao.maps.Polyline({path:[center,targetCoord]});
  const meters100px=line.getLength();
  const niceMeters=niceScaleDistance(meters100px);
  const width=Math.max(40,Math.round(100*(niceMeters/meters100px)));

  scaleBar.style.width=width+'px';
  scaleBar.textContent=niceMeters>=1000 ? (niceMeters/1000)+' km' : Math.round(niceMeters)+' m';
}

kakao.maps.event.addListener(map,'zoom_changed',updateScaleBar);
kakao.maps.event.addListener(map,'idle',updateScaleBar);

async function loadRoute(){
  try{
    const response=await fetch('./flight-route.geojson');
    if(!response.ok) throw new Error('GeoJSON 파일을 불러오지 못했습니다.');
    const geojson=await response.json();
    if(!geojson.features||!Array.isArray(geojson.features)) throw new Error('유효한 GeoJSON FeatureCollection이 아닙니다.');
    let lineCount=0;
    geojson.features.forEach(feature=>{
      if(!feature.geometry)return;
      const labelNumber=feature.properties?.num ?? feature.properties?.num1 ?? '';
      if(feature.geometry.type==='LineString'){drawLineString(feature.geometry.coordinates,labelNumber);lineCount++;}
      if(feature.geometry.type==='MultiLineString'){feature.geometry.coordinates.forEach(coords=>{drawLineString(coords,labelNumber);lineCount++;});}
    });
    if(routePolylines.length>0){
      map.setBounds(routeBounds);
      const fittedLevel=map.getLevel();
      map.setLevel(Math.max(1,fittedLevel-1));
    }
    updateRouteLabelVisibility();
    populateRouteNumberMenu();
    statusEl.textContent='비행경로 '+lineCount+'개 선 표시 완료';
  }catch(error){console.error(error);statusEl.textContent='GeoJSON 로딩 오류: '+error.message;}
}
function drawLineString(coordinates,labelNumber){
  const localBounds=new kakao.maps.LatLngBounds();
  const path=coordinates.map(coord=>{
    const latLng=new kakao.maps.LatLng(coord[1],coord[0]);
    routeBounds.extend(latLng);
    localBounds.extend(latLng);
    return latLng;
  });

  const routeLine=new kakao.maps.Polyline({
    map:map,
    path:path,
    strokeWeight:3,
    strokeColor:'#E53935',
    strokeOpacity:.9,
    strokeStyle:'solid',
    clickable:true,
    zIndex:5
  });

  routeLine._routeEnabled=true;
  routeLine._routeNumber=labelNumber!=='' ? String(labelNumber) : '';

  if(labelNumber!==''){
    const key=String(labelNumber);
    if(!routeIndex.has(key)){
      routeIndex.set(key,{
        bounds:new kakao.maps.LatLngBounds(),
        lines:[]
      });
    }
    const entry=routeIndex.get(key);
    path.forEach(p=>entry.bounds.extend(p));
    entry.lines.push(routeLine);
  }

  // 모바일에서도 쉽게 선택할 수 있도록 같은 경로에 넓은 투명 터치영역을 둠
  const hitLine=new kakao.maps.Polyline({
    map:map,
    path:path,
    strokeWeight:24,
    strokeColor:'#000000',
    strokeOpacity:0.01,
    strokeStyle:'solid',
    clickable:true,
    zIndex:6
  });

  const openRouteMenu=function(mouseEvent){
    const pos=(mouseEvent && mouseEvent.latLng)
      ? mouseEvent.latLng
      : path[Math.floor(path.length/2)];
    showRouteSelectPopup(routeLine,pos);
  };

  kakao.maps.event.addListener(hitLine,'click',openRouteMenu);
  kakao.maps.event.addListener(routeLine,'click',openRouteMenu);

  routeLine._hitLine=hitLine;
  routePolylines.push(routeLine);

  if(labelNumber!=='' && coordinates.length>0){
    const midIndex=Math.floor((coordinates.length-1)/2);
    const mid=coordinates[midIndex];
    const label=document.createElement('div');
    label.className='route-label';
    label.textContent=labelNumber;

    const overlay=new kakao.maps.CustomOverlay({
      map:null,
      position:new kakao.maps.LatLng(mid[1],mid[0]),
      content:label,
      xAnchor:0.5,
      yAnchor:0.5,
      zIndex:10
    });

    routeLine._labelOverlay=overlay;
    routeLabels.push(overlay);
    updateRouteLabelVisibility();
  }
}

function populateRouteNumberMenu(){
  const select=document.getElementById('routeNumberSelect');
  if(!select) return;

  const current=select.value;
  select.innerHTML='<option value="">번호 선택</option>';

  const nums=[...routeIndex.keys()].sort((a,b)=>{
    const na=Number(a), nb=Number(b);
    if(!Number.isNaN(na) && !Number.isNaN(nb)) return na-nb;
    return a.localeCompare(b,'ko');
  });

  nums.forEach(num=>{
    const option=document.createElement('option');
    option.value=num;
    option.textContent=num;
    select.appendChild(option);
  });

  if(current && routeIndex.has(current)) select.value=current;
}

function focusRouteNumber(num){
  const entry=routeIndex.get(String(num));
  if(!entry) return;

  map.setBounds(entry.bounds);

  // 너무 멀리 보이지 않도록 한 단계 확대
  setTimeout(()=>{
    map.setLevel(Math.max(1,map.getLevel()-1));
  },0);
}

document.getElementById('routeNumberSelect').addEventListener('change',function(){
  if(this.value) focusRouteNumber(this.value);
});

function updateRouteLabelVisibility(){
  // 카카오 지도 level 값은 숫자가 클수록 더 멀리 축소된 상태임
  const showByScale=routeToggle.checked && map.getLevel()<=8;

  routePolylines.forEach(line=>{
    if(line._labelOverlay){
      const showLabel=showByScale && line._routeEnabled!==false;
      line._labelOverlay.setMap(showLabel?map:null);
    }
  });
}

kakao.maps.event.addListener(map,'zoom_changed',updateRouteLabelVisibility);

routeToggle.addEventListener('change',()=>{
  const targetMap=routeToggle.checked?map:null;
  routePolylines.forEach(line=>{
    line.setMap(targetMap);
    if(line._hitLine) line._hitLine.setMap(targetMap);
  });
  routeLabels.forEach(label=>label.setMap(null));
  updateRouteLabelVisibility();
});
document.getElementById('roadBtn').addEventListener('click',()=>{map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);roadBtn.classList.add('active');skyBtn.classList.remove('active');});
document.getElementById('skyBtn').addEventListener('click',()=>{map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);skyBtn.classList.add('active');roadBtn.classList.remove('active');});
document.getElementById('zoomInBtn').addEventListener('click',()=>map.setLevel(Math.max(1,map.getLevel()-1)));
document.getElementById('zoomOutBtn').addEventListener('click',()=>map.setLevel(map.getLevel()+1));
document.getElementById('fitBtn').addEventListener('click',()=>{if(routePolylines.length>0)map.setBounds(routeBounds);});
function locateMe(){
  if(!navigator.geolocation){
    alert('이 브라우저에서는 현재 위치 기능을 사용할 수 없습니다.');
    return;
  }

  statusEl.textContent='현재 위치 확인 중...';

  navigator.geolocation.getCurrentPosition(position=>{
    const lat=position.coords.latitude;
    const lng=position.coords.longitude;
    const loc=new kakao.maps.LatLng(lat,lng);

    if(currentMarker) currentMarker.setMap(null);

    currentMarker=new kakao.maps.Marker({
      map:map,
      position:loc
    });

    map.setCenter(loc);
    map.setLevel(4);
    statusEl.textContent='현재 위치: '+lat.toFixed(6)+', '+lng.toFixed(6);
  },error=>{
    console.error(error);
    statusEl.textContent='현재 위치를 가져오지 못했습니다.';
    alert('위치 권한을 허용했는지 확인해 주세요.');
  },{
    enableHighAccuracy:true,
    timeout:10000,
    maximumAge:0
  });
}

document.getElementById('locBtn').addEventListener('click',locateMe);
document.getElementById('floatingLocBtn').addEventListener('click',locateMe);
updateScaleBar();
loadRoute();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(console.error);
  });
}
</script>
</body>
</html>
