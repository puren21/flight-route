<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>비행경로</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #map { width: 100%; height: 100%; }
    .panel { position:absolute; top:16px; left:16px; z-index:10; width:220px; padding:14px; background:rgba(255,255,255,.96); border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.18); }
    .panel h1 { margin:0; font-size:18px; }
    .panel-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }
    .panel-toggle {
      flex:0 0 auto;
      width:34px;
      height:34px;
      padding:0;
      border-radius:8px;
      font-size:18px;
      font-weight:700;
      line-height:1;
    }
    .panel-body { display:block; }
    .panel.collapsed {
      width:auto;
      min-width:0;
      padding:10px 12px;
    }
    .panel.collapsed .panel-header {
      margin-bottom:0;
    }
    .panel.collapsed .panel-body {
      display:none;
    }
    .panel.collapsed h1 {
      font-size:16px;
    }
    .row { display:flex; gap:8px; margin-top:8px; }
    button { flex:1; border:0; border-radius:8px; padding:9px 10px; background:#f1f3f5; cursor:pointer; font-size:14px; }
    button:hover { background:#e9ecef; }
    button.active { background:#222; color:#fff; }
    .toggle { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; }
    .status { margin-top:10px; font-size:12px; line-height:1.5; color:#555; }
    .floating-location {
      position: absolute;
      right: 14px;
      bottom: 56px;
      z-index: 12;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(0,0,0,.18);
      border-radius: 22px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
      font-size: 20px;
      line-height: 44px;
      text-align: center;
      cursor: pointer;
      color: #222;
    }
    .floating-location:hover { background: #fff; }
    .address-popup {
      width: 250px;
      padding: 12px;
      background: rgba(255,255,255,.98);
      border-radius: 10px;
      box-shadow: 0 3px 14px rgba(0,0,0,.28);
      color: #222;
      font-size: 13px;
      line-height: 1.45;
    }
    .address-popup .title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 5px;
    }
    .address-popup .addr {
      word-break: keep-all;
    }
    .address-popup .coord {
      margin-top: 4px;
      color: #777;
      font-size: 11px;
    }
    .address-popup .navi-btn {
      width: 100%;
      margin-top: 9px;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      background: #fee500;
      color: #191919;
      font-weight: 700;
      cursor: pointer;
    }
    .address-popup .naver-btn {
      width: 100%;
      margin-top: 6px;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      background: #03c75a;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .address-popup .close-btn {
      position: absolute;
      right: 8px;
      top: 6px;
      border: 0;
      background: transparent;
      padding: 2px 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .scale-bar {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 10;
      min-width: 70px;
      padding: 3px 8px 2px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(0,0,0,.45);
      border-top: 0;
      color: #222;
      font-size: 11px;
      text-align: center;
      line-height: 1.2;
      pointer-events: none;
    }
    .scale-bar::before {
      content: "";
      position: absolute;
      left: -1px;
      right: -1px;
      top: 0;
      border-top: 2px solid #222;
    }
    .route-label {
      color: #111;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      text-shadow:
        -1px -1px 0 rgba(255,255,255,.95),
         1px -1px 0 rgba(255,255,255,.95),
        -1px  1px 0 rgba(255,255,255,.95),
         1px  1px 0 rgba(255,255,255,.95);
      transform: translate(-50%, -50%);
    }
    @media (max-width:700px) {
      .panel { top:10px; left:10px; right:10px; width:auto; padding:10px; }
      .panel h1 { font-size:16px; }
      .panel.collapsed { right:auto; width:auto; }
      button { padding:8px 6px; font-size:13px; }
      .status { font-size:11px; }
    }
  </style>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7ee4bab8cd4d6be6d0d68a49e9b4502b&libraries=services"></script>
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
</head>
<body>
<div id="map"></div>
<div id="scaleBar" class="scale-bar">축척 계산 중...</div>
<button id="floatingLocBtn" class="floating-location" type="button" title="현재 위치" aria-label="현재 위치">◎</button>
<div class="panel collapsed" id="controlPanel">
  <div class="panel-header">
    <h1>비행경로</h1>
    <button id="panelToggleBtn" class="panel-toggle" type="button" aria-label="메뉴 펼치기">＋</button>
  </div>
  <div class="panel-body">
    <label class="toggle"><input type="checkbox" id="routeToggle" checked /> 비행경로 표시</label>
    <div class="row"><button id="roadBtn" class="active">일반지도</button><button id="skyBtn">위성지도</button></div>
    <div class="row"><button id="zoomInBtn">확대 +</button><button id="zoomOutBtn">축소 −</button></div>
    <div class="row"><button id="fitBtn">전체 경로</button><button id="locBtn">현재 위치</button></div>
    <div class="status" id="status">GeoJSON 불러오는 중...</div>
  </div>
</div>
<script>
const map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(35.16,126.84),level:8});

let routePolylines=[],routeLabels=[],routeBounds=new kakao.maps.LatLngBounds(),currentMarker=null;
const statusEl=document.getElementById('status'),routeToggle=document.getElementById('routeToggle');
const controlPanel=document.getElementById('controlPanel');
const panelToggleBtn=document.getElementById('panelToggleBtn');

panelToggleBtn.addEventListener('click',()=>{
  const collapsed=controlPanel.classList.toggle('collapsed');
  panelToggleBtn.textContent=collapsed?'＋':'−';
  panelToggleBtn.setAttribute('aria-label',collapsed?'메뉴 펼치기':'메뉴 접기');
});
const geocoder=new kakao.maps.services.Geocoder();
let addressOverlay=null;

if(window.Kakao && !Kakao.isInitialized()){
  Kakao.init('7ee4bab8cd4d6be6d0d68a49e9b4502b');
}
function startKakaoNavi(name,lat,lng){
  if(!window.Kakao || !Kakao.isInitialized() || !Kakao.Navi){
    alert('카카오내비 연결을 준비하지 못했습니다.');
    return;
  }

  Kakao.Navi.start({
    name: name || '선택 위치',
    x: lng,
    y: lat,
    coordType: 'wgs84'
  });
}

function startNaverMapRoute(name,lat,lng){
  const appName=encodeURIComponent(window.location.origin + window.location.pathname);
  const destinationName=encodeURIComponent(name || '선택 위치');
  const url='nmap://route/car?dlat='+lat+
    '&dlng='+lng+
    '&dname='+destinationName+
    '&appname='+appName;

  window.location.href=url;
}

function showAddressPopup(latLng){
  const lat=latLng.getLat();
  const lng=latLng.getLng();

  geocoder.coord2Address(lng,lat,function(result,status){
    let jibun='지번 정보를 찾을 수 없습니다.';

    if(status===kakao.maps.services.Status.OK && result && result[0]){
      if(result[0].address && result[0].address.address_name){
        jibun=result[0].address.address_name;
      }else if(result[0].road_address && result[0].road_address.address_name){
        jibun=result[0].road_address.address_name;
      }
    }

    if(addressOverlay){
      addressOverlay.setMap(null);
      addressOverlay=null;
    }

    const box=document.createElement('div');
    box.className='address-popup';

    const close=document.createElement('button');
    close.className='close-btn';
    close.type='button';
    close.textContent='×';

    const title=document.createElement('div');
    title.className='title';
    title.textContent='지번 정보';

    const addr=document.createElement('div');
    addr.className='addr';
    addr.textContent=jibun;

    const coord=document.createElement('div');
    coord.className='coord';
    coord.textContent=lat.toFixed(6)+', '+lng.toFixed(6);

    const navi=document.createElement('button');
    navi.className='navi-btn';
    navi.type='button';
    navi.textContent='카카오내비 길찾기';
    navi.addEventListener('click',()=>startKakaoNavi(jibun,lat,lng));

    const naver=document.createElement('button');
    naver.className='naver-btn';
    naver.type='button';
    naver.textContent='네이버지도 길찾기';
    naver.addEventListener('click',()=>startNaverMapRoute(jibun,lat,lng));

    close.addEventListener('click',()=>{
      if(addressOverlay){
        addressOverlay.setMap(null);
        addressOverlay=null;
      }
    });

    box.appendChild(close);
    box.appendChild(title);
    box.appendChild(addr);
    box.appendChild(coord);
    box.appendChild(navi);
    box.appendChild(naver);

    addressOverlay=new kakao.maps.CustomOverlay({
      map:map,
      position:latLng,
      content:box,
      xAnchor:0.5,
      yAnchor:1.08,
      zIndex:30
    });
  });
}

kakao.maps.event.addListener(map,'rightclick',function(mouseEvent){
  showAddressPopup(mouseEvent.latLng);
});

function niceScaleDistance(meters){
  const exponent=Math.pow(10,Math.floor(Math.log10(meters)));
  const fraction=meters/exponent;
  let niceFraction;
  if(fraction>=5) niceFraction=5;
  else if(fraction>=2) niceFraction=2;
  else niceFraction=1;
  return niceFraction*exponent;
}

function updateScaleBar(){
  const scaleBar=document.getElementById('scaleBar');
  if(!scaleBar) return;

  const center=map.getCenter();
  const projection=map.getProjection();
  if(!projection) return;

  const centerPoint=projection.containerPointFromCoords(center);
  const targetPoint=new kakao.maps.Point(centerPoint.x+100,centerPoint.y);
  const targetCoord=projection.coordsFromContainerPoint(targetPoint);

  const line=new kakao.maps.Polyline({path:[center,targetCoord]});
  const meters100px=line.getLength();
  const niceMeters=niceScaleDistance(meters100px);
  const width=Math.max(40,Math.round(100*(niceMeters/meters100px)));

  scaleBar.style.width=width+'px';
  scaleBar.textContent=niceMeters>=1000 ? (niceMeters/1000)+' km' : Math.round(niceMeters)+' m';
}

kakao.maps.event.addListener(map,'zoom_changed',updateScaleBar);
kakao.maps.event.addListener(map,'idle',updateScaleBar);

async function loadRoute(){
  try{
    const response=await fetch('./flight-route.geojson');
    if(!response.ok) throw new Error('GeoJSON 파일을 불러오지 못했습니다.');
    const geojson=await response.json();
    if(!geojson.features||!Array.isArray(geojson.features)) throw new Error('유효한 GeoJSON FeatureCollection이 아닙니다.');
    let lineCount=0;
    geojson.features.forEach(feature=>{
      if(!feature.geometry)return;
      const labelNumber=feature.properties?.num ?? feature.properties?.num1 ?? '';
      if(feature.geometry.type==='LineString'){drawLineString(feature.geometry.coordinates,labelNumber);lineCount++;}
      if(feature.geometry.type==='MultiLineString'){feature.geometry.coordinates.forEach(coords=>{drawLineString(coords,labelNumber);lineCount++;});}
    });
    if(routePolylines.length>0) map.setBounds(routeBounds);
    updateRouteLabelVisibility();
    statusEl.textContent='비행경로 '+lineCount+'개 선 표시 완료';
  }catch(error){console.error(error);statusEl.textContent='GeoJSON 로딩 오류: '+error.message;}
}
function drawLineString(coordinates,labelNumber){
  const path=coordinates.map(coord=>{
    const latLng=new kakao.maps.LatLng(coord[1],coord[0]);
    routeBounds.extend(latLng);
    return latLng;
  });

  routePolylines.push(new kakao.maps.Polyline({
    map,
    path,
    strokeWeight:4,
    strokeColor:'#E53935',
    strokeOpacity:.9,
    strokeStyle:'solid',
    zIndex:5
  }));

  if(labelNumber!=='' && coordinates.length>0){
    const midIndex=Math.floor((coordinates.length-1)/2);
    const mid=coordinates[midIndex];
    const label=document.createElement('div');
    label.className='route-label';
    label.textContent=labelNumber;

    const overlay=new kakao.maps.CustomOverlay({
      map: null,
      position:new kakao.maps.LatLng(mid[1],mid[0]),
      content:label,
      xAnchor:0.5,
      yAnchor:0.5,
      zIndex:10
    });

    routeLabels.push(overlay);
    updateRouteLabelVisibility();
  }
}
function updateRouteLabelVisibility(){
  // 카카오 지도 level 값은 숫자가 클수록 더 멀리 축소된 상태임
  const showLabels=routeToggle.checked && map.getLevel()<=8;
  routeLabels.forEach(label=>label.setMap(showLabels?map:null));
}

kakao.maps.event.addListener(map,'zoom_changed',updateRouteLabelVisibility);

routeToggle.addEventListener('change',()=>{
  const targetMap=routeToggle.checked?map:null;
  routePolylines.forEach(line=>line.setMap(targetMap));
  routeLabels.forEach(label=>label.setMap(null));
  updateRouteLabelVisibility();
});
document.getElementById('roadBtn').addEventListener('click',()=>{map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);roadBtn.classList.add('active');skyBtn.classList.remove('active');});
document.getElementById('skyBtn').addEventListener('click',()=>{map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);skyBtn.classList.add('active');roadBtn.classList.remove('active');});
document.getElementById('zoomInBtn').addEventListener('click',()=>map.setLevel(Math.max(1,map.getLevel()-1)));
document.getElementById('zoomOutBtn').addEventListener('click',()=>map.setLevel(map.getLevel()+1));
document.getElementById('fitBtn').addEventListener('click',()=>{if(routePolylines.length>0)map.setBounds(routeBounds);});
function locateMe(){
  if(!navigator.geolocation){
    alert('이 브라우저에서는 현재 위치 기능을 사용할 수 없습니다.');
    return;
  }

  statusEl.textContent='현재 위치 확인 중...';

  navigator.geolocation.getCurrentPosition(position=>{
    const lat=position.coords.latitude;
    const lng=position.coords.longitude;
    const loc=new kakao.maps.LatLng(lat,lng);

    if(currentMarker) currentMarker.setMap(null);

    currentMarker=new kakao.maps.Marker({
      map:map,
      position:loc
    });

    map.setCenter(loc);
    map.setLevel(4);
    statusEl.textContent='현재 위치: '+lat.toFixed(6)+', '+lng.toFixed(6);
  },error=>{
    console.error(error);
    statusEl.textContent='현재 위치를 가져오지 못했습니다.';
    alert('위치 권한을 허용했는지 확인해 주세요.');
  },{
    enableHighAccuracy:true,
    timeout:10000,
    maximumAge:0
  });
}

document.getElementById('locBtn').addEventListener('click',locateMe);
document.getElementById('floatingLocBtn').addEventListener('click',locateMe);
updateScaleBar();
loadRoute();
</script>
</body>
</html>
