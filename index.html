<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>비행경로</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      position:fixed;
      inset:0;
      width:100vw;
      min-width:0;
      max-width:100vw;
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #map {
      position:fixed;
      inset:0;
      width:100vw !important;
      min-width:0 !important;
      max-width:100vw !important;
      height:100dvh !important;
      overflow:hidden;
    }
    .panel { position:absolute; top:16px; left:16px; z-index:10; width:220px; padding:14px; background:rgba(255,255,255,.96); border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.18); }
    .panel h1 { margin:0; font-size:18px; }
    .panel-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }
    .mobile-menu-launcher{
      display:block;
      position:fixed;
      top:calc(env(safe-area-inset-top, 0px) + 10px);
      left:calc(env(safe-area-inset-left, 0px) + 10px);
      z-index:2147483647;
      width:44px;
      height:44px;
      min-width:44px;
      padding:0;
      border:1px solid rgba(0,0,0,.18);
      border-radius:12px;
      background:rgba(255,255,255,.98);
      box-shadow:0 3px 12px rgba(0,0,0,.24);
      font-size:22px;
      line-height:44px;
      text-align:center;
      color:#222;
    }
    .panel-toggle {
      flex:0 0 auto;
      width:34px;
      height:34px;
      padding:0;
      border-radius:8px;
      font-size:18px;
      font-weight:700;
      line-height:1;
    }
    .panel-body { display:block; }
    .route-number-wrap {
      margin: 8px 0 10px;
    }
    .route-number-wrap label {
      display:block;
      font-size:12px;
      color:#555;
      margin-bottom:4px;
    }
    .route-number-select {
      width:100%;
      padding:7px 8px;
      border:1px solid #ccc;
      border-radius:7px;
      background:#fff;
      font-size:13px;
    }
    .route-style-controls {
      margin: 8px 0 10px;
      padding: 9px;
      border: 1px solid #e1e4e8;
      border-radius: 9px;
      background: #fafafa;
    }
    .geo-controls {
      display:grid;
      gap:7px;
      padding-top:6px;
    }
    .geo-controls select,
    .geo-controls button {
      width:100%;
    }
    .geo-toggle-row {
      display:flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      color:#333;
    }
    .geo-toggle-row input { flex:0 0 auto; }
    .geo-swatch {
      width:12px;
      height:12px;
      border-radius:50%;
      border:1px solid rgba(0,0,0,.28);
      flex:0 0 12px;
    }
    .kr-airspace-legend {
      display:grid;
      gap:5px;
      margin-top:4px;
      font-size:11px;
      color:#555;
    }
    .kr-airspace-row {
      display:flex;
      align-items:center;
      gap:7px;
    }
    .kr-airspace-row input { flex:0 0 auto; }
    .geo-note {
      font-size:10px;
      line-height:1.4;
      color:#777;
    }
    .geo-link {
      display:block;
      margin-top:2px;
      font-size:11px;
      color:#0D6EFD;
      text-decoration:none;
    }
    .route-style-title {
      font-size: 12px;
      font-weight: 700;
      color: #444;
      margin-bottom: 7px;
    }
    .style-section-toggle {
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:7px 8px;
      margin-top:6px;
      border:0;
      border-radius:7px;
      background:#f1f3f5;
      font-size:12px;
      font-weight:700;
      color:#333;
      cursor:pointer;
    }
    .style-section-body { display:none; padding-top:2px; }
    .style-section-body.open { display:block; }
    .memo-list {
      margin-top:8px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .memo-empty {
      font-size:12px;
      color:#777;
      padding:6px 2px;
    }
    .memo-item {
      width:100%;
      display:grid;
      grid-template-columns:42px 1fr;
      gap:7px;
      align-items:start;
      padding:7px 8px;
      border:1px solid #e2e5e9;
      border-radius:7px;
      background:#fff;
      text-align:left;
      cursor:pointer;
    }
    .memo-item:hover { background:#f7f8fa; }
    .memo-num {
      font-size:12px;
      font-weight:700;
      color:#0D47A1;
    }
    .memo-text {
      font-size:12px;
      line-height:1.35;
      color:#444;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
    }
    .route-style-row {
      display: grid;
      grid-template-columns: 48px 1fr 44px;
      align-items: center;
      gap: 7px;
      margin-top: 7px;
      font-size: 12px;
      color: #555;
    }
    .route-style-row input[type="range"] {
      width: 100%;
      margin: 0;
    }
    .route-style-row input[type="color"] {
      width: 100%;
      height: 28px;
      padding: 1px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    .route-style-value {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #333;
    }
    .panel.collapsed {
      width:auto;
      min-width:0;
      padding:10px 12px;
    }
    .panel.collapsed .panel-header {
      margin-bottom:0;
    }
    .panel.collapsed .panel-body {
      display:none;
    }
    .panel.collapsed h1 {
      font-size:16px;
    }
    .row { display:flex; gap:8px; margin-top:8px; }
    button { flex:1; border:0; border-radius:8px; padding:9px 10px; background:#f1f3f5; cursor:pointer; font-size:14px; }
    button:hover { background:#e9ecef; }
    button.active { background:#222; color:#fff; }
    .toggle { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; }
    .status { margin-top:10px; font-size:12px; line-height:1.5; color:#555; }
    .floating-location {
      position: absolute;
      right: 14px;
      bottom: 56px;
      z-index: 12;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(0,0,0,.18);
      border-radius: 22px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
      font-size: 20px;
      line-height: 44px;
      text-align: center;
      cursor: pointer;
      color: #222;
    }
    .floating-location:hover { background: #fff; }
    .route-select-popup {
      width: 120px;
      padding: 8px;
      background: rgba(255,255,255,.98);
      border-radius: 10px;
      box-shadow: 0 3px 14px rgba(0,0,0,.28);
      font-size: 13px;
      color: #222;
    }
    .route-select-popup .route-select-title {
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }
    .route-select-popup .route-select-actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .route-select-popup button {
      width:100%;
      flex: 0 0 auto;
      min-height:42px;
      padding: 9px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-weight: 700;
      font-size:14px;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .05s ease;
    }
    .route-select-popup button:active{
      transform:scale(.99);
    }
    .route-toggle-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      min-height:42px;
      padding:4px 2px;
    }
    .route-toggle-label{
      font-size:12px;
      font-weight:700;
      color:#4b5157;
    }
    .route-toggle-switch{
      position:relative;
      width:50px;
      height:30px;
      flex:0 0 50px;
      padding:0;
      border:0;
      border-radius:15px;
      background:#d8dde2;
      cursor:pointer;
      transition:background .18s ease;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
    }
    .route-toggle-switch::after{
      content:"";
      position:absolute;
      top:2px;
      left:2px;
      width:26px;
      height:26px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 1px 4px rgba(0,0,0,.24);
      transition:transform .18s ease;
    }
    .route-toggle-switch.on{
      background:#34c759;
    }
    .route-toggle-switch.on::after{
      transform:translateX(20px);
    }
    .route-select-popup .route-memo-btn {
      background:#f6efe3;
      border-color:#eadfcb;
      color:#705a35;
    }
    .route-select-popup .route-memo-btn:hover{
      background:#efe4d2;
    }
    .route-select-popup .route-prop-btn {
      background:#e7f1ff;
      color:#0D47A1;
    }
    .memo-modal-backdrop {
      position:fixed;
      inset:0;
      z-index:2147483647;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(0,0,0,.35);
    }
    .memo-modal-backdrop.open { display:flex; }
    .memo-modal {
      position:relative;
      width:220px;
      max-width:calc(100vw - 16px);
      overflow:hidden;
      background:#f2f2f7;
      border-radius:18px;
      box-shadow:0 10px 28px rgba(0,0,0,.22);
      padding:0;
    }
    .memo-modal-title {
      margin:0;
      padding:13px 18px;
      min-height:0;
      display:flex;
      align-items:center;
      background:#a6a6a6;
      color:#fff;
      font-size:20px;
      font-weight:600;
      line-height:1.1;
      cursor:grab;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
    }
    .memo-modal-title:active { cursor:grabbing; }
    .memo-modal textarea {
      width:calc(100% - 16px);
      min-height:120px;
      margin:8px 8px 0;
      resize:vertical;
      padding:10px;
      border:0;
      border-radius:16px;
      background:#fff;
      font:inherit;
      font-size:14px;
      line-height:1.45;
      box-sizing:border-box;
      outline:none;
    }
    .memo-modal-actions {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
      padding:8px;
      margin:0;
    }
    .memo-modal-actions button {
      min-height:40px;
      padding:8px 6px;
      border:0;
      border-radius:12px;
      font-size:13px;
      font-weight:600;
    }
    .memo-save-btn { background:#34c759; color:#fff; }
    .memo-delete-btn { background:#fff; color:#c92a2a; }
    .memo-cancel-btn { background:#fff; color:#222; }
    .address-popup {
      width: 250px;
      padding: 12px;
      background: rgba(255,255,255,.98);
      border-radius: 10px;
      box-shadow: 0 3px 14px rgba(0,0,0,.28);
      color: #222;
      font-size: 13px;
      line-height: 1.45;
    }
    .address-popup .title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 5px;
    }
    .address-popup .addr {
      word-break: keep-all;
    }
    .address-popup .coord {
      margin-top: 4px;
      color: #777;
      font-size: 11px;
    }
    .address-popup .route-actions {
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-top:9px;
    }
    .address-popup .route-actions button {
      width:100%;
      margin-top:0;
    }
    .address-popup .navi-btn {
      width: 100%;
      margin-top: 0;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      background: #fee500;
      color: #191919;
      font-weight: 700;
      cursor: pointer;
    }
    .address-popup .naver-btn {
      width: 100%;
      margin-top: 0;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      background: #03c75a;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .address-popup .close-btn {
      position: absolute;
      right: 8px;
      top: 6px;
      border: 0;
      background: transparent;
      padding: 2px 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .scale-bar {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 10;
      min-width: 70px;
      padding: 3px 8px 2px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(0,0,0,.45);
      border-top: 0;
      color: #222;
      font-size: 11px;
      text-align: center;
      line-height: 1.2;
      pointer-events: none;
    }
    .scale-bar::before {
      content: "";
      position: absolute;
      left: -1px;
      right: -1px;
      top: 0;
      border-top: 2px solid #222;
    }
    .route-label {
      color: #0D47A1;
      opacity: 1;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      text-shadow:
        -1px -1px 0 rgba(255,255,255,.95),
         1px -1px 0 rgba(255,255,255,.95),
        -1px  1px 0 rgba(255,255,255,.95),
         1px  1px 0 rgba(255,255,255,.95);
      transform: translate(-50%, -50%);
    }
    @media (min-width:701px) {
      .mobile-menu-launcher { display:none !important; }
    }
    @media (max-width:700px) {
      .mobile-menu-launcher{
        display:block;
        position:fixed;
        top:calc(env(safe-area-inset-top, 0px) + 10px);
        left:10px;
        z-index:2147483647;
      }
      .panel {
        position:fixed;
        top:calc(env(safe-area-inset-top, 0px) + 62px);
        left:10px;
        right:10px;
        width:auto;
        max-width:none;
        max-height:calc(100dvh - env(safe-area-inset-top, 0px) - 80px);
        overflow-y:auto;
        padding:10px;
        z-index:2147483646;
        display:block;
        visibility:visible;
      }
      .panel.collapsed {
        display:none;
      }
      .panel:not(.collapsed) + * { }
      .panel * { min-width:0; }
      .panel h1 { font-size:16px; }
      .route-number-select,
      .route-style-controls,
      .style-section-toggle,
      .memo-list,
      .memo-item,
      .row {
        max-width:100%;
      }
      .memo-text,
      .status {
        overflow-wrap:anywhere;
        word-break:break-word;
      }
      .panel-toggle {
        width:36px;
        height:36px;
        min-width:36px;
      }
      .route-select-popup { max-width:calc(100vw - 24px); }
      .address-popup { max-width:calc(100vw - 24px); }
      .memo-modal { max-width:calc(100vw - 36px); }
      button { padding:8px 6px; font-size:13px; }
      .status { font-size:11px; }
    }
  
    /* unified responsive menu */
    .panel{
      width:320px;
      padding:12px;
      border:1px solid rgba(0,0,0,.08);
      border-radius:16px;
      background:rgba(255,255,255,.97);
      box-shadow:0 10px 30px rgba(0,0,0,.16);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }
    .panel-header{
      margin-bottom:10px;
      padding:2px 2px 8px;
      border-bottom:1px solid #edf0f2;
      cursor:pointer;
    }
    .panel h1{
      font-size:17px;
      letter-spacing:-.3px;
    }
    .panel-toggle{
      background:#f4f5f7;
      border:1px solid #e6e8eb;
    }
    .panel-body{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .menu-section{
      margin:0;
      padding:8px;
      border:1px solid #e7eaee;
      border-radius:12px;
      background:#fff;
    }
    .menu-section-title{
      margin-bottom:8px;
      font-size:12px;
      font-weight:800;
      color:#24292f;
      letter-spacing:-.2px;
    }
    .quick-grid{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:5px;
      margin-bottom:6px;
    }
    .quick-btn{
      min-height:40px;
      padding:8px 5px;
      border:1px solid #e2e5e9;
      background:#f7f8fa;
      font-size:12px;
      font-weight:700;
    }
    .quick-btn.active{
      background:#222;
      border-color:#222;
      color:#fff;
    }
    .airspace-card{
      min-height:46px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:8px 9px;
      border:1px solid #e8eaed;

    .airspace-label{

      align-items:center;

    }
    .airspace-label > span:last-child{
      display:flex;
      flex-direction:column;
      min-width:0;
    }
    .airspace-label strong{
      font-size:12px;
      color:#333;
    }
    .airspace-label small{
      margin-top:2px;
      font-size:10px;
      color:#888;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .airspace-card input{
      width:18px;
      height:18px;
      flex:0 0 auto;
    }
    .compact-link{
      margin:7px 2px 0;
      text-align:right;
    }
    .route-number-wrap{
      margin:0;
    }
    .route-number-wrap label{
      margin-bottom:6px;
      font-size:11px;
      color:#73777d;
    }
    .route-number-select{

      padding:0 10px;
      border-color:#dfe3e7;
      border-radius:9px;
      font-size:13px;
    }
    .style-section-toggle{

      margin-top:4px;

      height:24px;

      background:#eceff2;
      color:#333;
      font-size:19px;
      font-weight:500;
      line-height:1;
    }

      border:1px solid #e2e6ea;

      color:#34383d;
    }

    .main-menu-toggle{
      min-height:42px;
      margin-top:0;
      padding:9px 11px;
      border:1px solid #e1e5e9;
      border-radius:10px;
      background:#f5f6f8;
      color:#2a2e33;
      font-size:13px;
      font-weight:800;
      box-shadow:0 1px 0 rgba(0,0,0,.02);

    .main-menu-toggle:hover{

    }

      padding:2px 2px 2px 8px;

    .style-section-body{
      padding:2px 2px 1px;
    }
    .route-style-row{
      grid-template-columns:50px 1fr 48px;
      gap:7px;
      margin-top:6px;
    }
    .route-style-row input[type="color"]{
      height:32px;
    }
    .save-style-btn{
      min-height:38px;
      background:#222;
      color:#fff;
      font-weight:700;
    }
    .save-style-btn:hover{
      background:#111;
    }
    .subtle-action{
      width:100%;
      min-height:38px;
      margin-top:8px;
      border:1px solid #e6e8eb;
      background:#fff;
      color:#6b7075;
      font-size:11px;
    }
    .memo-item{
      min-height:42px;
      border-radius:9px;
    }
    .status{
      margin:0;
      padding:7px 3px 1px;
      color:#7a7f85;
      font-size:10px;
      text-align:center;
    }
    .panel.collapsed{
      width:auto;
      padding:9px 10px;
      border-radius:12px;
    }

    @media (max-width:700px){

const panelResizeHandle=document.getElementById('panelResizeHandle');
if(panelResizeHandle){
  let resizingPanel=false;
  let resizeStartY=0;
  let resizeStartHeight=0;

  const stopPanelResize=e=>{
    if(!resizingPanel) return;
    resizingPanel=false;
    controlPanel.classList.remove('resizing');
    try{ panelResizeHandle.releasePointerCapture?.(e.pointerId); }catch(err){}
    e.preventDefault();
    e.stopPropagation();
  };

  panelResizeHandle.addEventListener('pointerdown',e=>{
    if(controlPanel.classList.contains('collapsed')) return;
    if(e.button!==undefined && e.button!==0) return;

    resizingPanel=true;
    resizeStartY=e.clientY;
    resizeStartHeight=controlPanel.getBoundingClientRect().height;
    controlPanel.classList.add('resizing');

    try{ panelResizeHandle.setPointerCapture?.(e.pointerId); }catch(err){}
    e.preventDefault();
    e.stopPropagation();
  });

  panelResizeHandle.addEventListener('pointermove',e=>{
    if(!resizingPanel) return;

    const panelRect=controlPanel.getBoundingClientRect();
    const minHeight=220;
    const maxHeight=Math.max(minHeight,window.innerHeight-panelRect.top-8);
    const nextHeight=Math.min(maxHeight,Math.max(minHeight,resizeStartHeight+(e.clientY-resizeStartY)));

    controlPanel.style.setProperty('--user-panel-height',Math.round(nextHeight)+'px');
    e.preventDefault();
    e.stopPropagation();
  });

  panelResizeHandle.addEventListener('pointerup',stopPanelResize);
  panelResizeHandle.addEventListener('pointercancel',stopPanelResize);
}

function setRouteState(routeLine,enabled,persist=true){
  routeLine._routeEnabled=enabled;

    localStorage.setItem(ROUTE_STATE_STORAGE_KEY,JSON.stringify(savedRouteStates));

  }

  if(enabled){
    routeLine.setOptions({
      strokeWeight:routeStyle.weight,
      strokeColor:routeStyle.color,
      strokeOpacity:routeStyle.opacity
    });
    updateRouteOutline(routeLine,routeStyle.weight,routeStyle.opacity);
  }else{
    routeLine.setOptions({
      strokeWeight:offRouteStyle.weight,
      strokeColor:offRouteStyle.color,
      strokeOpacity:offRouteStyle.opacity
    });
    updateRouteOutline(routeLine,offRouteStyle.weight,offRouteStyle.opacity);
  }

  if(routeLine._labelOverlay){
    const showLabel=routeToggle.checked && map.getLevel()<=8;
    routeLine._labelOverlay.setMap(showLabel?map:null);
    if(routeLine._labelOverlay._labelElement){
      routeLine._labelOverlay._labelElement.style.opacity=
        enabled ? String(routeStyle.opacity) : String(offRouteStyle.opacity);
    }
  }
}

async function syncRemoteRouteStates(){
  const response=await fetch(
    SUPABASE_REST_URL+'/route_memos?on_conflict=route_number',
    {
      method:'POST',
      headers:{
        ...SUPABASE_HEADERS,
        'Prefer':'resolution=merge-duplicates,return=minimal'
      },
      body:JSON.stringify({
        route_number:ROUTE_STATE_CLOUD_KEY,
        memo:JSON.stringify(savedRouteStates),
        updated_at:new Date().toISOString()
      })
    }
  );
  if(!response.ok) throw new Error('경로 상태 동기화 실패 ('+response.status+')');
}

async function loadRemoteRouteStates(){
  try{
    const response=await fetch(
      SUPABASE_REST_URL+'/route_memos?route_number=eq.'+
        encodeURIComponent(ROUTE_STATE_CLOUD_KEY)+
        '&select=memo,updated_at',
      {headers:SUPABASE_HEADERS}
    );
    if(!response.ok) throw new Error('경로 상태 불러오기 실패 ('+response.status+')');
    const rows=await response.json();

    if(rows.length && rows[0].memo){
      try{
        savedRouteStates=JSON.parse(rows[0].memo)||{};
        localStorage.setItem(ROUTE_STATE_STORAGE_KEY,JSON.stringify(savedRouteStates));
      }catch(e){
        console.error('온라인 경로 상태 파싱 오류',e);
      }
    }else if(Object.keys(savedRouteStates).length){
      await syncRemoteRouteStates();
    }

    applySavedRouteStates();
  }catch(error){
    console.error(error);
    applySavedRouteStates();
  }
}

function persistRouteMemos(){

async function loadRemoteMemos(){
  try{
    const response=await fetch(
      SUPABASE_REST_URL+'/route_memos?select=route_number,memo,updated_at',
      {headers:SUPABASE_HEADERS}
    );
    if(!response.ok) throw new Error('메모 불러오기 실패 ('+response.status+')');

    const rows=await response.json();
    const remote={};
    rows.forEach(row=>{
      if(row.route_number===ROUTE_STATE_CLOUD_KEY) return;
      if(row.route_number && row.memo){
        remote[String(row.route_number)]={
          memo:row.memo,
          updated:row.updated_at || ''
        };
      }
    });

    // 온라인 데이터를 기준으로 동기화함.
    // 서버에서 삭제된 메모를 다른 기기의 오래된 localStorage가 다시 살려내지 않도록
    // 원격에 없는 로컬 메모는 자동 재업로드하지 않음.
    const local={...routeMemos};
    const merged={...remote};
    const uploads=[];

    Object.keys(local).forEach(num=>{
      const localItem=local[num];
      const remoteItem=remote[num];
      if(!localItem?.memo || !remoteItem) return;

      const localTime=Date.parse(localItem.updated||'')||0;
      const remoteTime=Date.parse(remoteItem.updated||'')||0;

      // 같은 메모가 서버에도 존재하고 로컬 수정본이 더 최신인 경우에만 업로드함.
      if(localTime>remoteTime){
        merged[num]=localItem;
        uploads.push(upsertRemoteMemo(num,localItem.memo,localItem.updated||new Date().toISOString()));
      }
    });

    if(uploads.length) await Promise.allSettled(uploads);

    routeMemos=merged;
    persistRouteMemos();
    return true;
  }catch(error){
    console.error(error);
    renderMemoList();
    return false;
  }
}

async function upsertRemoteMemo(num,memo,updatedAt){
  const response=await fetch(
    SUPABASE_REST_URL+'/route_memos?on_conflict=route_number',
    {
      method:'POST',
      headers:{
        ...SUPABASE_HEADERS,
        'Prefer':'resolution=merge-duplicates,return=minimal'
      },
      body:JSON.stringify({
        route_number:String(num),
        memo:memo,
        updated_at:updatedAt || new Date().toISOString()
      })
    }
  );
  if(!response.ok){
    const detail=await response.text();
    throw new Error('메모 저장 실패 ('+response.status+'): '+detail);
  }
}

async function deleteRemoteMemo(num){
  const response=await fetch(
    SUPABASE_REST_URL+'/route_memos?route_number=eq.'+encodeURIComponent(String(num)),
    {
      method:'DELETE',
      headers:{
        ...SUPABASE_HEADERS,
        'Prefer':'return=minimal'
      }
    }
  );
  if(!response.ok){
    const detail=await response.text();
    throw new Error('메모 삭제 실패 ('+response.status+'): '+detail);
  }
}

(function enableMemoModalDrag(){
  const modal=document.querySelector('.memo-modal');
  const handle=document.getElementById('memoModalTitle');
  if(!modal || !handle) return;

  let dragging=false;
  let startX=0, startY=0;
  let startLeft=0, startTop=0;

  const clamp=(v,min,max)=>Math.min(Math.max(v,min),max);

  handle.addEventListener('pointerdown',e=>{
    if(e.button!==undefined && e.button!==0) return;
    const rect=modal.getBoundingClientRect();

    modal.style.position='fixed';
    modal.style.left=rect.left+'px';
    modal.style.top=rect.top+'px';
    modal.style.margin='0';
    modal.style.transform='none';

    dragging=true;
    startX=e.clientX;
    startY=e.clientY;
    startLeft=rect.left;
    startTop=rect.top;

    try{ handle.setPointerCapture?.(e.pointerId); }catch(err){}
    e.preventDefault();
    e.stopPropagation();
  });

  handle.addEventListener('pointermove',e=>{
    if(!dragging) return;

    const maxLeft=Math.max(8,window.innerWidth-modal.offsetWidth-8);
    const maxTop=Math.max(8,window.innerHeight-modal.offsetHeight-8);

    const nextLeft=clamp(startLeft+(e.clientX-startX),8,maxLeft);
    const nextTop=clamp(startTop+(e.clientY-startY),8,maxTop);

    modal.style.left=nextLeft+'px';
    modal.style.top=nextTop+'px';
    e.preventDefault();
    e.stopPropagation();
  });

  const endDrag=e=>{
    if(!dragging) return;
    dragging=false;
    try{ handle.releasePointerCapture?.(e.pointerId); }catch(err){}
    e.stopPropagation();
  };

  handle.addEventListener('pointerup',endDrag);
  handle.addEventListener('pointercancel',endDrag);

  window.addEventListener('resize',()=>{
    if(getComputedStyle(modal).position!=='fixed') return;
    const rect=modal.getBoundingClientRect();
    const maxLeft=Math.max(8,window.innerWidth-modal.offsetWidth-8);
    const maxTop=Math.max(8,window.innerHeight-modal.offsetHeight-8);
    modal.style.left=clamp(rect.left,8,maxLeft)+'px';
    modal.style.top=clamp(rect.top,8,maxTop)+'px';
  });
})();

function normalizeRouteIdentity(value){
  let raw=String(value||'').trim();
  if(!raw) return '';

  const isDolsan=/^돌산_/i.test(raw);
  raw=raw.replace(/^돌산_/i,'');

  const parts=raw.split('_').filter(Boolean).map(part=>{
    const trimmed=part.trim();
    if(/^\d+$/.test(trimmed)) return String(Number(trimmed));
    return trimmed.toLowerCase();
  });

  if(!parts.length) return '';
  return (isDolsan?'돌산|':'일반|')+parts.join('|');
}

function routePrimaryIdentity(value){
  let raw=String(value||'').trim();
  if(!raw) return '';

  const isDolsan=/^돌산_/i.test(raw);
  raw=raw.replace(/^돌산_/i,'');

  const first=raw.split('_').filter(Boolean)[0] || '';
  if(!/^\d+$/.test(first)) return '';

  return (isDolsan?'돌산|':'일반|')+String(Number(first));
}

function resolveMemoRouteKeys(value){
  const raw=String(value||'').trim();
  if(!raw) return [];

  // 정확히 같은 키가 있으면 가장 우선함.
  if(routeIndex.has(raw)) return [raw];

  const fullIdentity=normalizeRouteIdentity(raw);
  const exactNormalized=[];

  for(const key of routeIndex.keys()){
    if(normalizeRouteIdentity(key)===fullIdentity){
      exactNormalized.push(String(key));
    }
  }
  if(exactNormalized.length) return exactNormalized;

  // 예: 메모가 027로 저장됐는데 실제 경로가
  // 027_00 / 027_01 / 027_02로 나뉘어 있으면 모두 선택함.
  const primary=routePrimaryIdentity(raw);
  if(!primary) return [];

  const primaryMatches=[];
  for(const key of routeIndex.keys()){
    if(routePrimaryIdentity(key)===primary){
      primaryMatches.push(String(key));
    }
  }

  return primaryMatches;
}

let memoRouteFocusTimer=null;

function focusMemoRoute(value){
  const keys=resolveMemoRouteKeys(value);
  if(!keys.length) return false;

  const bounds=new kakao.maps.LatLngBounds();
  let hasBounds=false;

  keys.forEach(key=>{
    const entry=routeIndex.get(key);
    if(!entry?.bounds) return;

    try{
      const sw=entry.bounds.getSouthWest?.();
      const ne=entry.bounds.getNorthEast?.();

      if(sw && ne){
        bounds.extend(sw);
        bounds.extend(ne);
        hasBounds=true;
      }
    }catch(e){
      console.error('메모 경로 범위 계산 오류',key,e);
    }
  });

  if(!hasBounds) return false;

  clearTimeout(memoRouteFocusTimer);

  try{
    map.setBounds(bounds);

    memoRouteFocusTimer=setTimeout(()=>{
      try{
        map.setLevel(Math.max(1,map.getLevel()-1));
      }catch(e){
        console.error('메모 경로 확대 오류',e);
      }
    },40);

    return true;
  }catch(e){
    console.error('메모 경로 이동 오류',e);
    return false;
  }
}

function renderMemoList(){
  const list=document.getElementById('memoList');
  if(!list) return;
  list.innerHTML='';

  const keys=Object.keys(routeMemos)
    .filter(num=>routeMemos[num]?.memo)
    .sort((a,b)=>{
      const na=normalizeMemoSortNumber(a);
      const nb=normalizeMemoSortNumber(b);

      if(na!==null && nb!==null){
        if(na!==nb) return na-nb;
        return String(a).localeCompare(String(b),'ko',{numeric:true});
      }
      if(na!==null) return -1;
      if(nb!==null) return 1;
      return String(a).localeCompare(String(b),'ko',{numeric:true});
    });

  if(keys.length===0){
    const empty=document.createElement('div');

  let popupDragPointerId=null;
  let popupDragStartX=0;
  let popupDragStartY=0;
  let popupDragStartPoint=null;

  const stopPopupDrag=()=>{
    popupDragPointerId=null;
    popupDragStartPoint=null;
  };

  title.addEventListener('pointerdown',e=>{
    if(e.button!==undefined && e.button!==0) return;
    if(!routeSelectOverlay) return;

    e.preventDefault();
    e.stopPropagation();

    box.style.pointerEvents='auto';

    const projection=map.getProjection();
    const overlayPosition=routeSelectOverlay.getPosition();

    popupDragPointerId=e.pointerId;
    popupDragStartX=e.clientX;
    popupDragStartY=e.clientY;

    try{ title.setPointerCapture(e.pointerId); }catch(err){}
  });

  title.addEventListener('pointermove',e=>{
    if(popupDragPointerId===null || e.pointerId!==popupDragPointerId || !popupDragStartPoint || !routeSelectOverlay) return;

    e.preventDefault();
    e.stopPropagation();
    kakao.maps.event.preventMap();

    const projection=map.getProjection();
    const nextPoint=new kakao.maps.Point(
      popupDragStartPoint.x+(e.clientX-popupDragStartX),
      popupDragStartPoint.y+(e.clientY-popupDragStartY)
    );
    routeSelectOverlay.setPosition(projection.coordsFromContainerPoint(nextPoint));
  });

  title.addEventListener('pointerup',e=>{
    if(popupDragPointerId!==e.pointerId) return;
    try{ title.releasePointerCapture(e.pointerId); }catch(err){}
    stopPopupDrag();
  });

  title.addEventListener('pointercancel',stopPopupDrag);
}

function isMobileRouteDevice(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints>1 && /Macintosh/i.test(navigator.userAgent));
}

function openAppWithWebFallback(appUrl,webUrl){
  let fallbackTimer=null;
  const cancelFallback=()=>{
    if(document.hidden && fallbackTimer){
      clearTimeout(fallbackTimer);
      fallbackTimer=null;
    }
  };
  document.addEventListener('visibilitychange',cancelFallback,{once:true});
  window.location.href=appUrl;
  fallbackTimer=setTimeout(()=>{
    if(!document.hidden) window.location.href=webUrl;
  },1200);
}

function startKakaoNavi(name,lat,lng){
  const destinationName=encodeURIComponent(name || '선택 위치');
  const webUrl='https://map.kakao.com/link/to/'+destinationName+','+lat+','+lng;

  if(isMobileRouteDevice()){
    if(window.Kakao && Kakao.isInitialized() && Kakao.Navi){
      Kakao.Navi.start({
        name: name || '선택 위치',
        x: lng,
        y: lat,
        coordType: 'wgs84'
      });
      return;
    }

    const appUrl='kakaonavi://navigate?name='+destinationName+
      '&x='+lng+
      '&y='+lat+
      '&coord_type=wgs84';
    openAppWithWebFallback(appUrl,webUrl);
    return;
  }

  window.open(webUrl,'_blank','noopener,noreferrer');
}

function wgs84ToWebMercator(lat,lng){
  const x=lng*20037508.34/180;
  let y=Math.log(Math.tan((90+lat)*Math.PI/360))/(Math.PI/180);
  y=y*20037508.34/180;
  return {x:x,y:y};
}

function startNaverMapRoute(name,lat,lng){
  const rawName=name || '선택 위치';
  const destinationName=encodeURIComponent(rawName);
  const appName=encodeURIComponent(window.location.origin + window.location.pathname);

  if(isMobileRouteDevice()){
    const appUrl='nmap://route/car?dlat='+lat+
      '&dlng='+lng+
      '&dname='+destinationName+
      '&appname='+appName;
    const p=wgs84ToWebMercator(lat,lng);
    const webUrl='https://map.naver.com/p/directions/-/'+
      p.x+','+p.y+','+destinationName+',,ADDRESS_POI/-/car';
    openAppWithWebFallback(appUrl,webUrl);
    return;
  }

  const p=wgs84ToWebMercator(lat,lng);
  const webUrl='https://map.naver.com/p/directions/-/'+
    p.x+','+p.y+','+destinationName+',,ADDRESS_POI/-/car';
  window.open(webUrl,'_blank','noopener,noreferrer');
}

// iOS Safari에서 지도 위를 길게 눌렀을 때 주변 라벨/텍스트가 선택되지 않도록 전체 지도 영역의 선택 동작을 차단함.
// 단, 입력창/버튼/링크 등 실제 조작 요소는 예외로 둠.
const isInteractiveMapTarget=target=>{
  if(!(target instanceof Element)) return false;
  return !!target.closest('input, textarea, select, button, a, [contenteditable="true"]');
};

['pointerdown','touchstart'].forEach(eventName=>{
  mapElement.addEventListener(eventName,event=>{
    if(isInteractiveMapTarget(event.target)) return;
    if(eventName==='touchstart' && event.touches && event.touches.length>1) return;
    const sel=window.getSelection?.();
    if(sel && !sel.isCollapsed) sel.removeAllRanges();
  },{capture:true,passive:true});
});

document.addEventListener('selectionchange',()=>{
  if(!window.matchMedia('(max-width:700px)').matches) return;
  const sel=window.getSelection?.();
  if(!sel || sel.isCollapsed || sel.rangeCount===0) return;
  const node=sel.anchorNode;
  const el=node?.nodeType===1 ? node : node?.parentElement;
  if(el && mapElement.contains(el) && !isInteractiveMapTarget(el)){
    sel.removeAllRanges();
  }
});

function niceScaleDistance(meters){
  const exponent=Math.pow(10,Math.floor(Math.log10(meters)));
  const fraction=meters/exponent;
  let niceFraction;
  if(fraction>=5) niceFraction=5;
  else if(fraction>=2) niceFraction=2;
  else niceFraction=1;
  return niceFraction*exponent;
}

function updateScaleBar(){
  const scaleBar=document.getElementById('scaleBar');
  const verticalScaleBar=document.getElementById('verticalScaleBar');
  if(!scaleBar && !verticalScaleBar) return;

  const projection=map.getProjection();
  if(!projection) return;

  const mapRect=mapElement.getBoundingClientRect();
  const center=map.getCenter();
  const centerPoint=projection.containerPointFromCoords(center);

  // 하단 가로 스케일
  if(scaleBar){
    const usableWidth=Math.max(80,mapRect.width-24);
    const halfWidth=usableWidth/2;
    const leftPoint=new kakao.maps.Point(centerPoint.x-halfWidth,centerPoint.y);
    const rightPoint=new kakao.maps.Point(centerPoint.x+halfWidth,centerPoint.y);
    const leftCoord=projection.coordsFromContainerPoint(leftPoint);
    const rightCoord=projection.coordsFromContainerPoint(rightPoint);
    const horizontalLine=new kakao.maps.Polyline({path:[leftCoord,rightCoord]});
    const horizontalMeters=horizontalLine.getLength();

    scaleBar.style.removeProperty('width');
    scaleBar.textContent=horizontalMeters>=1000
      ? (horizontalMeters/1000).toFixed(horizontalMeters>=10000?0:1).replace(/\.0$/,'')+' km'
      : Math.round(horizontalMeters)+' m';
  }

  // 우측 세로 스케일
  if(verticalScaleBar){
    const usableHeight=Math.max(120,mapRect.height-120);
    const halfHeight=usableHeight/2;
    const topPoint=new kakao.maps.Point(centerPoint.x,centerPoint.y-halfHeight);
    const bottomPoint=new kakao.maps.Point(centerPoint.x,centerPoint.y+halfHeight);
    const topCoord=projection.coordsFromContainerPoint(topPoint);
    const bottomCoord=projection.coordsFromContainerPoint(bottomPoint);
    const verticalLine=new kakao.maps.Polyline({path:[topCoord,bottomCoord]});
    const verticalMeters=verticalLine.getLength();

    verticalScaleBar.textContent=verticalMeters>=1000
      ? (verticalMeters/1000).toFixed(verticalMeters>=10000?0:1).replace(/\.0$/,'')+' km'
      : Math.round(verticalMeters)+' m';
  }
}

kakao.maps.event.addListener(map,'zoom_changed',updateScaleBar);
kakao.maps.event.addListener(map,'idle',updateScaleBar);

async function loadRoute(){
  try{
    const response=await fetch('./flight-route.geojson');
    if(!response.ok) throw new Error('GeoJSON 파일을 불러오지 못했습니다.');
    const geojson=await response.json();
    if(!geojson.features||!Array.isArray(geojson.features)) throw new Error('유효한 GeoJSON FeatureCollection이 아닙니다.');
    let lineCount=0;
    geojson.features.forEach(feature=>{
      if(!feature.geometry)return;
      const rawLabelNumber=feature.properties?.num ?? feature.properties?.num1 ?? '';
      // GeoJSON의 fid 129는 돌산 구간인데 num이 "025"로 잘못 들어가 있어
      // 일반 025와 멀리 떨어진 두 구간이 하나로 묶이는 문제가 발생함.
      const labelNumber=(
        Number(feature.properties?.fid)===129 &&
        String(rawLabelNumber)==='025'
      ) ? '돌산_025' : rawLabelNumber;
      if(feature.geometry.type==='LineString'){drawLineString(feature.geometry.coordinates,labelNumber);lineCount++;}
      if(feature.geometry.type==='MultiLineString'){feature.geometry.coordinates.forEach(coords=>{drawLineString(coords,labelNumber);lineCount++;});}
    });
    if(routePolylines.length>0){
      map.setBounds(routeBounds);
      const fittedLevel=map.getLevel();
      map.setLevel(Math.max(1,fittedLevel-1));
    }
    updateRouteLabelVisibility();
    populateRouteNumberMenu();
    statusEl.textContent='비행경로 '+lineCount+'개 선 표시 완료';
  }catch(error){console.error(error);statusEl.textContent='GeoJSON 로딩 오류: '+error.message;}
}
function smoothRoutePath(sourcePath,iterations=2,ratio=0.12){
  if(!Array.isArray(sourcePath) || sourcePath.length<3) return sourcePath;

  let points=sourcePath.slice();
  for(let pass=0;pass<iterations;pass++){
    const next=[points[0]];
    for(let i=0;i<points.length-1;i++){
      const a=points[i];
      const b=points[i+1];
      const alat=a.getLat(), alng=a.getLng();
      const blat=b.getLat(), blng=b.getLng();

      next.push(new kakao.maps.LatLng(
        alat+(blat-alat)*ratio,
        alng+(blng-alng)*ratio
      ));
      next.push(new kakao.maps.LatLng(
        blat-(blat-alat)*ratio,
        blng-(blng-alng)*ratio
      ));
    }
    next.push(points[points.length-1]);
    points=next;
  }
  return points;
}

function getRouteOutlineWeight(weight){
  return Math.max(Number(weight)+4,7);
}

function updateRouteOutline(routeLine,weight,opacity){
  if(!routeLine?._outlineLine) return;
  routeLine._outlineLine.setOptions({
    strokeWeight:getRouteOutlineWeight(weight),
    strokeColor:'#FFFFFF',
    strokeOpacity:Math.min(1,Math.max(.82,Number(opacity)||.9)),
    strokeStyle:'solid'
  });
}

function drawLineString(coordinates,labelNumber){
  const localBounds=new kakao.maps.LatLngBounds();
  const path=coordinates.map(coord=>{
    const latLng=new kakao.maps.LatLng(coord[1],coord[0]);
    routeBounds.extend(latLng);
    localBounds.extend(latLng);
    return latLng;
  });
  const displayPath=smoothRoutePath(path);

  // 위성지도에서도 잘 보이도록 기존 컬러선 아래에 더 두꺼운 흰색 바탕선을 겹쳐 그림.
  const outlineLine=new kakao.maps.Polyline({
    map:map,
    path:displayPath,
    strokeWeight:getRouteOutlineWeight(routeStyle.weight),
    strokeColor:'#FFFFFF',
    strokeOpacity:.95,
    strokeStyle:'solid',
    clickable:false,
    zIndex:4
  });

  const routeLine=new kakao.maps.Polyline({
    map:map,
    path:displayPath,
    strokeWeight:routeStyle.weight,
    strokeColor:routeStyle.color,
    strokeOpacity:routeStyle.opacity,
    strokeStyle:'solid',
    clickable:true,
    zIndex:5
  });

  routeLine._outlineLine=outlineLine;

  routeLine._routeNumber=labelNumber!=='' ? String(labelNumber) : '';
  const savedEnabled=routeLine._routeNumber &&
    Object.prototype.hasOwnProperty.call(savedRouteStates,routeLine._routeNumber)
      ? savedRouteStates[routeLine._routeNumber]!==false
      : true;
  routeLine._routeEnabled=savedEnabled;
  if(!savedEnabled){
    routeLine.setOptions({
      strokeWeight:offRouteStyle.weight,
      strokeColor:offRouteStyle.color,
      strokeOpacity:offRouteStyle.opacity
    });
    updateRouteOutline(routeLine,offRouteStyle.weight,offRouteStyle.opacity);
  }else{
    updateRouteOutline(routeLine,routeStyle.weight,routeStyle.opacity);
  }

  if(labelNumber!==''){
    const key=String(labelNumber);
    if(!routeIndex.has(key)){
      routeIndex.set(key,{
        bounds:new kakao.maps.LatLngBounds(),
        lines:[]
      });
    }
    const entry=routeIndex.get(key);
    path.forEach(p=>entry.bounds.extend(p));
    entry.lines.push(routeLine);
  }

  // 모바일에서도 쉽게 선택할 수 있도록 같은 경로에 넓은 투명 터치영역을 둠
  const hitLine=new kakao.maps.Polyline({
    map:map,
    path:displayPath,
    strokeWeight:24,
    strokeColor:'#000000',
    strokeOpacity:0.01,
    strokeStyle:'solid',
    clickable:true,
    zIndex:6
  });

  const openRouteMenu=function(mouseEvent){
    const pos=(mouseEvent && mouseEvent.latLng)
      ? mouseEvent.latLng
      : displayPath[Math.floor(displayPath.length/2)];
    showRouteSelectPopup(routeLine,pos);
  };

  kakao.maps.event.addListener(hitLine,'click',openRouteMenu);
  kakao.maps.event.addListener(routeLine,'click',openRouteMenu);

  routeLine._hitLine=hitLine;
  routePolylines.push(routeLine);

  if(labelNumber!=='' && coordinates.length>0){
    const midIndex=Math.floor((coordinates.length-1)/2);
    const mid=coordinates[midIndex];
    const label=document.createElement('div');
    label.className='route-label';
    label.textContent=labelNumber;
    label.style.fontSize=labelStyle.size+'px';
    label.style.color=labelStyle.color;

    const overlay=new kakao.maps.CustomOverlay({
      map:null,
      position:new kakao.maps.LatLng(mid[1],mid[0]),
      content:label,
      xAnchor:0.5,
      yAnchor:0.5,
      zIndex:10
    });

    overlay._labelElement=label;
    routeLine._labelOverlay=overlay;
    routeLabels.push(overlay);
    setRouteState(routeLine,savedEnabled,false);
    updateRouteLabelVisibility();
  }
}

let routeWheelNumbers=[];
let routeWheelSelected='';
let routeWheelScrollTimer=null;

function populateRouteNumberMenu(){
  const wheel=document.getElementById('routeNumberWheel');
  if(!wheel) return;

  const prefix=document.getElementById('routePrefixSelect')?.value || 'normal';

  routeWheelNumbers=[...routeIndex.keys()]
    .filter(num=>prefix==='dolsan'
      ? String(num).startsWith('돌산_')
      : !String(num).startsWith('돌산_'))
    .sort((a,b)=>{
      const normalizeNumber=value=>{
        const text=String(value).replace(/^돌산_/,'').trim();
        const numeric=parseInt(text,10);
        return Number.isNaN(numeric) ? null : numeric;
      };

      const na=normalizeNumber(a);
      const nb=normalizeNumber(b);

      // 1, 01, 001을 모두 같은 숫자 1로 판단해서 정렬함.
      if(na!==null && nb!==null){
        if(na!==nb) return na-nb;

        // 같은 숫자라면 표기 형식만 안정적으로 정리함.
        return String(a).localeCompare(String(b),'ko',{numeric:true});
      }

      if(na!==null) return -1;
      if(nb!==null) return 1;
      return String(a).localeCompare(String(b),'ko',{numeric:true});
    });

  wheel.innerHTML='';

  // iOS 휠처럼 첫/마지막 값도 중앙까지 올 수 있도록 위아래 여백을 둠.
  const topSpacer=document.createElement('div');
  topSpacer.className='route-wheel-spacer';
  wheel.appendChild(topSpacer);

  routeWheelNumbers.forEach(num=>{
    const item=document.createElement('button');
    item.type='button';
    item.className='route-wheel-item';
    item.dataset.value=num;
    item.setAttribute('role','option');
    item.textContent=String(num).startsWith('돌산_')
      ? String(num)
      : String(num).replace(/^0+(?=\d)/,'');
    item.addEventListener('click',()=>{
      scrollRouteWheelTo(num,true);
    });
    wheel.appendChild(item);
  });

  const bottomSpacer=document.createElement('div');
  bottomSpacer.className='route-wheel-spacer';
  wheel.appendChild(bottomSpacer);

  if(routeWheelNumbers.length){
    const initial=(routeWheelSelected && routeIndex.has(routeWheelSelected))
      ? routeWheelSelected
      : routeWheelNumbers[0];
    requestAnimationFrame(()=>scrollRouteWheelTo(initial,false));
  }
}

function focusRouteNumber(num){
  const entry=routeIndex.get(String(num));
  if(!entry) return;

  map.setBounds(entry.bounds);

  // 너무 멀리 보이지 않도록 한 단계 확대
  setTimeout(()=>{
    map.setLevel(Math.max(1,map.getLevel()-1));
  },0);
}

function routeWheelNearest(){
  const wheel=document.getElementById('routeNumberWheel');
  if(!wheel) return null;
  const center=wheel.scrollTop+wheel.clientHeight/2;
  let nearest=null;
  let nearestDist=Infinity;

  wheel.querySelectorAll('.route-wheel-item').forEach(item=>{
    const itemCenter=item.offsetTop+item.offsetHeight/2;
    const dist=Math.abs(itemCenter-center);
    if(dist<nearestDist){
      nearest=item;
      nearestDist=dist;
    }
  });
  return nearest;
}

function syncRouteWheelSelection(focusMap=true){
  const wheel=document.getElementById('routeNumberWheel');
  const item=routeWheelNearest();
  if(!wheel || !item) return;

  const num=item.dataset.value;
  const changed=routeWheelSelected!==num;
  routeWheelSelected=num;

  wheel.querySelectorAll('.route-wheel-item').forEach(el=>{
    const active=el===item;
    el.classList.toggle('active',active);
    el.setAttribute('aria-selected',active?'true':'false');
  });

  if(focusMap) focusRouteNumber(num);
}

function scrollRouteWheelTo(num,focusMap=true){
  const wheel=document.getElementById('routeNumberWheel');
  if(!wheel) return;
  const item=wheel.querySelector('.route-wheel-item[data-value="'+CSS.escape(String(num))+'"]');
  if(!item) return;

  const target=item.offsetTop-(wheel.clientHeight-item.offsetHeight)/2;
  wheel.scrollTo({top:target,behavior:focusMap?'smooth':'auto'});

  if(focusMap){
    clearTimeout(routeWheelScrollTimer);
    routeWheelScrollTimer=setTimeout(()=>syncRouteWheelSelection(true),500);
  }else{
    requestAnimationFrame(()=>syncRouteWheelSelection(false));
  }
}

document.getElementById('routeNumberWheel')?.addEventListener('scroll',()=>{
  clearTimeout(routeWheelScrollTimer);

  // 휠이 움직이는 동안에는 선택 표시만 갱신하고 지도는 이동하지 않음.
  syncRouteWheelSelection(false);

  // 스크롤이 완전히 멈춘 뒤 잠깐 여유를 두고 최종 선택 경로로 이동함.
  routeWheelScrollTimer=setTimeout(()=>{
    syncRouteWheelSelection(true);
  },500);
},{passive:true});

function normalizeRouteSearchValue(value){
  const raw=String(value||'').trim();
  if(!raw) return '';

  const prefix=document.getElementById('routePrefixSelect')?.value || 'normal';

  // 사용자가 전체 번호를 직접 넣은 경우도 우선 허용함.
  if(routeIndex.has(raw)) return raw;

  const numeric=Number(raw);
  if(Number.isNaN(numeric)) return '';

  if(prefix==='dolsan'){
    const dolsanCandidates=[
      '돌산_'+String(numeric),
      '돌산_'+String(numeric).padStart(2,'0'),
      '돌산_'+String(numeric).padStart(3,'0')
    ];
    for(const candidate of dolsanCandidates){
      if(routeIndex.has(candidate)) return candidate;
    }
    return '';
  }

  const candidates=[
    String(numeric),
    String(numeric).padStart(2,'0'),
    String(numeric).padStart(3,'0')
  ];
  for(const candidate of candidates){
    if(routeIndex.has(candidate)) return candidate;
  }

  return '';
}

function goToRouteFromInput(){
  const input=document.getElementById('routeNumberInput');
  if(!input) return;

  const num=normalizeRouteSearchValue(input.value);
  if(!num){
    input.classList.add('invalid');
    setTimeout(()=>input.classList.remove('invalid'),700);
    return;
  }

  input.classList.remove('invalid');
  input.value=num;
  scrollRouteWheelTo(num,false);

  clearTimeout(routeWheelScrollTimer);
  routeWheelScrollTimer=setTimeout(()=>{
    focusRouteNumber(num);
  },220);
}

let routeNumberInputTimer=null;

document.getElementById('routeNumberGoBtn')?.addEventListener('click',goToRouteFromInput);

document.getElementById('routeNumberInput')?.addEventListener('input',e=>{
  clearTimeout(routeNumberInputTimer);

  const input=e.currentTarget;
  const num=normalizeRouteSearchValue(input.value);

  if(!num){
    input.classList.remove('invalid');
    return;
  }

  input.classList.remove('invalid');

  // 유효한 경로번호가 입력된 뒤 0.5초 동안 추가 입력이 없으면 자동 이동함.
  routeNumberInputTimer=setTimeout(()=>{
    input.value=num;
    scrollRouteWheelTo(num,false);
    focusRouteNumber(num);
  },500);
});

document.getElementById('routeNumberInput')?.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    clearTimeout(routeNumberInputTimer);
    goToRouteFromInput();
    e.currentTarget.blur();
  }
});

document.getElementById('routePrefixSelect')?.addEventListener('change',()=>{
  clearTimeout(routeNumberInputTimer);

  // 구분을 바꾸면 아래 휠도 즉시 해당 그룹만 표시함.

  populateRouteNumberMenu();

    scrollRouteWheelTo(num,false);
    focusRouteNumber(num);
  },500);
});

function updateRouteLabelVisibility(){
  // 카카오 지도 level 값은 숫자가 클수록 더 멀리 축소된 상태임
  const showByScale=routeToggle.checked && map.getLevel()<=8;

  routePolylines.forEach(line=>{
    if(line._labelOverlay){
      line._labelOverlay.setMap(showByScale?map:null);
      if(line._labelOverlay._labelElement){
        line._labelOverlay._labelElement.style.opacity=
          line._routeEnabled===false ? String(offRouteStyle.opacity) : String(routeStyle.opacity);
      }
    }
  });
}

function applyRouteStyle(){
  routePolylines.forEach(line=>{
    if(line._routeEnabled!==false){
      line.setOptions({
        strokeWeight:routeStyle.weight,
        strokeColor:routeStyle.color,
        strokeOpacity:routeStyle.opacity
      });
      updateRouteOutline(line,routeStyle.weight,routeStyle.opacity);
      if(line._labelOverlay?._labelElement){
        line._labelOverlay._labelElement.style.opacity=String(routeStyle.opacity);
      }

function mercatorToWgs84Point(pt){
  if(!Array.isArray(pt) || pt.length<2) return null;
  const x=Number(pt[0]), y=Number(pt[1]);
  if(!Number.isFinite(x)||!Number.isFinite(y)) return null;

  // 이미 WGS84로 저장된 경우 그대로 사용
  if(Math.abs(x)<=180 && Math.abs(y)<=90){
    return new kakao.maps.LatLng(y,x);
  }

  const max=20037508.34;
  const lon=x/max*180;
  const lat=180/Math.PI*(2*Math.atan(Math.exp((y/max*180)*Math.PI/180))-Math.PI/2);
  return new kakao.maps.LatLng(lat,lon);
}

function airspaceName(props,spec){
  if(!props) return spec.label;
  for(const key of spec.nameFields){
    const v=props[key];
    if(v!==undefined && v!==null && String(v).trim()) return String(v).trim();
  }
  for(const [k,v] of Object.entries(props)){
    if(typeof v==='string' && v.trim() && !v.trim().startsWith('<')) return v.trim();
  }
  return spec.label;
}

function addKoreanAirspaceRing(ring,spec,key,name){
  if(!Array.isArray(ring)) return 0;
  const path=ring.map(mercatorToWgs84Point).filter(Boolean);
  if(path.length<3) return 0;

  const polygon=new kakao.maps.Polygon({
    map:null,
    path:path,
    strokeWeight:2,
    strokeColor:spec.color,
    strokeOpacity:.85,
    strokeStyle:'solid',
    fillColor:spec.color,
    fillOpacity:spec.fillOpacity
  });
  krAirspaceOverlays[key].push(polygon);
  return 1;
}

function renderKoreanAirspaceFeature(feature,spec,key){
  if(!feature?.geometry) return 0;
  const geom=feature.geometry;
  const name=airspaceName(feature.properties,spec);
  let count=0;

  if(geom.type==='Polygon'){
    const outer=geom.coordinates?.[0];
    count+=addKoreanAirspaceRing(outer,spec,key,name);
  }else if(geom.type==='MultiPolygon'){
    (geom.coordinates||[]).forEach(poly=>{
      const outer=poly?.[0];
      count+=addKoreanAirspaceRing(outer,spec,key,name);
    });
  }
  return count;
}

async function loadKoreanAirspace(){
  const status=document.getElementById('krAirspaceStatus');
  if(krAirspaceLoaded){
    refreshKoreanAirspaceVisibility();
    return;
  }
  if(status) status.textContent='국내 공역 데이터를 불러오는 중...';

  try{
    let polygonCount=0;
    for(const [key,spec] of Object.entries(KR_AIRSPACE_SPECS)){
      const res=await fetch(spec.url,{cache:'no-store'});
      if(!res.ok) throw new Error(spec.label+' HTTP '+res.status);
      const data=await res.json();
      (data.features||[]).forEach(feature=>{
        polygonCount+=renderKoreanAirspaceFeature(feature,spec,key);
      });
    }
    krAirspaceLoaded=true;
    refreshKoreanAirspaceVisibility();
    if(status) status.textContent='국내 공역 '+polygonCount+'개 폴리곤 표시 준비 완료';
  }catch(error){
    console.error('Korean airspace load error',error);
    if(status) status.textContent='국내 공역 데이터를 불러오지 못했습니다.';
  }
}

function normalizeHeading(value){
  const n=Number(value);
  if(!Number.isFinite(n)) return null;
  return ((n%360)+360)%360;
}

function updateLocationHeadingVisual(){
  if(!currentLocationHeadingEl) return;
  const heading=normalizeHeading(currentHeading);
  if(heading===null){
    currentLocationHeadingEl.classList.remove('visible');
    return;
  }

  currentLocationHeadingEl.classList.add('visible');
  currentLocationHeadingEl.style.transform='translateX(-50%) rotate('+heading+'deg)';
}

function distanceMeters(lat1,lng1,lat2,lng2){
  const R=6371000;
  const toRad=v=>v*Math.PI/180;
  const p1=toRad(lat1);
  const p2=toRad(lat2);
  const dp=toRad(lat2-lat1);
  const dl=toRad(lng2-lng1);
  const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function bearingBetween(lat1,lng1,lat2,lng2){
  const toRad=v=>v*Math.PI/180;
  const toDeg=v=>v*180/Math.PI;
  const p1=toRad(lat1);
  const p2=toRad(lat2);
  const dl=toRad(lng2-lng1);

  const y=Math.sin(dl)*Math.cos(p2);
  const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return normalizeHeading(toDeg(Math.atan2(y,x)));
}

function smoothHeading(previous,next){
  const prev=normalizeHeading(previous);
  const target=normalizeHeading(next);
  if(target===null) return prev;
  if(prev===null) return target;

  let delta=((target-prev+540)%360)-180;
  return normalizeHeading(prev+delta*0.35);
}

function ensureCurrentLocationMarker(loc){
  if(currentMarker) return;

  const markerEl=document.createElement('div');
  markerEl.className='current-location-marker';
  markerEl.setAttribute('aria-label','현재 위치');

  const headingEl=document.createElement('div');
  headingEl.className='current-location-heading';

  const dotEl=document.createElement('div');
  dotEl.className='current-location-dot';

  markerEl.appendChild(headingEl);
  markerEl.appendChild(dotEl);

  currentLocationMarkerEl=markerEl;
  currentLocationHeadingEl=headingEl;

  currentMarker=new kakao.maps.CustomOverlay({
    map:map,
    position:loc,
    content:markerEl,
    xAnchor:0.5,
    yAnchor:0.5,
    zIndex:80
  });

  updateLocationHeadingVisual();
}

function animateCurrentLocationTo(loc){
  ensureCurrentLocationMarker(loc);

  if(locationMoveAnimation){
    cancelAnimationFrame(locationMoveAnimation);
    locationMoveAnimation=null;
  }

  const from=currentLocationLatLng || loc;
  const fromLat=from.getLat();
  const fromLng=from.getLng();
  const toLat=loc.getLat();
  const toLng=loc.getLng();
  const duration=650;
  const started=performance.now();

  const ease=t=>1-Math.pow(1-t,3);

  const frame=now=>{
    const p=Math.min(1,(now-started)/duration);
    const ep=ease(p);
    const lat=fromLat+(toLat-fromLat)*ep;
    const lng=fromLng+(toLng-fromLng)*ep;
    const point=new kakao.maps.LatLng(lat,lng);

    currentMarker.setPosition(point);

    if(p<1){
      locationMoveAnimation=requestAnimationFrame(frame);
    }else{
      currentLocationLatLng=loc;
      locationMoveAnimation=null;
    }
  };

  locationMoveAnimation=requestAnimationFrame(frame);
}

function updateCurrentLocationMarker(loc){
  if(!currentLocationLatLng){
    currentLocationLatLng=loc;
    ensureCurrentLocationMarker(loc);
    currentMarker.setPosition(loc);
    return;
  }

  animateCurrentLocationTo(loc);
  currentMarker.setMap(map);
}

function handleDeviceOrientation(event){
  let heading=null;

  if(Number.isFinite(event.webkitCompassHeading)){
    heading=event.webkitCompassHeading;
  }else if(Number.isFinite(event.alpha)){
    heading=360-event.alpha;
  }

  heading=normalizeHeading(heading);
  if(heading===null) return;

  deviceHeading=heading;
  if(currentHeading===null) updateLocationHeadingVisual();
}

async function enableDeviceHeading(){
  if(deviceOrientationListening || typeof DeviceOrientationEvent==='undefined') return;

  try{
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const permission=await DeviceOrientationEvent.requestPermission();
      if(permission!=='granted') return;
    }

    window.addEventListener('deviceorientationabsolute',handleDeviceOrientation,true);
    window.addEventListener('deviceorientation',handleDeviceOrientation,true);
    deviceOrientationListening=true;
  }catch(error){
    console.warn('방향 센서 사용 불가',error);
  }
}

function handleLocationUpdate(position){
  const lat=position.coords.latitude;
  const lng=position.coords.longitude;
  const loc=new kakao.maps.LatLng(lat,lng);

  // 화살표는 휴대폰이 바라보는 방향이 아니라 실제 GPS 이동 궤적을 기준으로 함.
  if(lastMovementPosition){
    const moved=distanceMeters(
      lastMovementPosition.lat,
      lastMovementPosition.lng,
      lat,
      lng
    );

    // GPS 흔들림은 방향으로 취급하지 않음.
    if(moved>=2.5){
      const movementBearing=bearingBetween(
        lastMovementPosition.lat,
        lastMovementPosition.lng,
        lat,
        lng
      );
      currentHeading=smoothHeading(currentHeading,movementBearing);
      lastMovementPosition={lat,lng};
    }
  }else{
    lastMovementPosition={lat,lng};
  }

  updateCurrentLocationMarker(loc);
  updateLocationHeadingVisual();

  // 실제 이동을 따라가되 현재 줌 수준은 유지함.
  if(locationTrackingStarted){
    map.panTo(loc);
  }else{
    map.setCenter(loc);
    map.setLevel(4);
    locationTrackingStarted=true;
  }

  statusEl.textContent='현재 위치 추적 중 · '+lat.toFixed(6)+', '+lng.toFixed(6);
}

function handleLocationError(error){
  console.error(error);

  let message='현재 위치를 가져오지 못했습니다.';
  if(error && error.code===1) message='위치 권한을 허용해 주세요.';
  else if(error && error.code===2) message='현재 위치를 확인할 수 없습니다.';
  else if(error && error.code===3) message='현재 위치 확인 시간이 초과되었습니다.';

  statusEl.textContent=message;
  alert(message);
}

async function locateMe(){
  if(!navigator.geolocation){
    alert('이 브라우저에서는 현재 위치 기능을 사용할 수 없습니다.');
    return;
  }

  // 이미 추적 중이면 새 추적을 만들지 않고 현재 위치로 즉시 복귀함.
  if(locationWatchId!==null){
    if(currentLocationLatLng) map.setCenter(currentLocationLatLng);
    statusEl.textContent='현재 위치 추적 중';
    return;
  }

  statusEl.textContent='현재 위치 확인 중...';
  locationTrackingStarted=false;
  currentHeading=null;
  lastMovementPosition=null;

  locationWatchId=navigator.geolocation.watchPosition(
    handleLocationUpdate,
    handleLocationError,
    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:1000
    }
  );
}

  flex-direction:column;
  overflow:hidden;
  border:0;
  border-radius:var(--ios-radius);
  background:var(--ios-card);
  box-shadow:0 0 0 .5px rgba(60,60,67,.08);
}
.ios-menu-row{
  position:relative;
  width:100%;
  min-height:54px;
  padding:0 14px;
  border:0;
  border-radius:0;
  background:var(--ios-card);
  color:var(--ios-text);
  font-size:16px;
  font-weight:400;
  text-align:left;
}
.ios-menu-row:not(:last-child)::after{
  content:"";
  position:absolute;
  left:55px;
  right:0;
  bottom:0;
  height:.5px;
  background:var(--ios-separator);
}
.ios-menu-row:hover,
.ios-menu-row:active{background:#f6f6f8;}
.ios-menu-left{gap:11px;}
.ios-menu-text{font-size:16px;font-weight:400;letter-spacing:-.2px;}
.ios-menu-icon{
  width:29px;
  height:29px;
  flex-basis:29px;
  border-radius:7px;
}
.ios-menu-icon svg{width:18px;height:18px;}
.ios-chevron{
  color:#c7c7cc;
  font-size:28px;
  font-weight:300;
}

/* Detail pages */
.menu-page,
.menu-page.active{
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
}
.menu-page.active{
  display:flex;
  flex-direction:column;
  gap:16px;
}
.route-number-wrap,
#labelPage > .route-style-row,
#labelPage > .row,
#stylePage > .style-section-toggle,
#stylePage > .style-section-body,
#stylePage > .subtle-action,
#otherPage > .quick-grid,
#otherPage > .airspace-card,
#otherPage > .geo-link,
#otherPage > .style-section-toggle,
#otherPage > .style-section-body{
  margin-left:0;
  margin-right:0;
}

/* Card groups and rows */
.route-number-wrap{
  padding:12px 14px 14px;
  border-radius:var(--ios-radius);
  background:var(--ios-card);
}
.route-number-wrap label{
  display:block;
  margin:0 0 8px;
  color:var(--ios-secondary);
  font-size:13px;
  font-weight:500;
}
.route-number-select{
  width:100%;
  height:44px;
  padding:0 38px 0 12px;
  border:0;
  border-radius:10px;
  background:#f2f2f7;
  color:var(--ios-text);
  font-size:15px;
}

.style-section-toggle{
  width:100%;
  min-height:54px;
  margin:0;
  padding:0 14px;
  border:0;
  border-radius:var(--ios-radius);
  background:var(--ios-card);
  color:var(--ios-text);
  font-size:16px;
  font-weight:400;
  text-align:left;
  box-shadow:0 0 0 .5px rgba(60,60,67,.08);
}
.style-section-toggle:hover,
.style-section-toggle:active{background:#f6f6f8;}
.style-section-toggle > span:last-child{
  width:auto;
  height:auto;
  min-width:18px;
  flex-basis:auto;
  margin-left:auto;
  border:0;
  border-radius:0;
  background:transparent;
  color:#c7c7cc;
  font-size:28px !important;
  font-weight:300 !important;
}

.style-section-body{
  margin:-10px 0 0;
  padding:6px 14px 12px;
  border:0;
  border-radius:0 0 var(--ios-radius) var(--ios-radius);
  background:var(--ios-card);
  box-shadow:0 0 0 .5px rgba(60,60,67,.08);
}
.style-section-toggle[aria-expanded="true"],
.style-section-toggle.open{
  border-radius:var(--ios-radius) var(--ios-radius) 0 0;
}
.route-style-row{
  position:relative;
  display:grid;
  grid-template-columns:62px minmax(0,1fr) 52px;
  align-items:center;
  gap:10px;
  min-height:50px;
  margin:0;
  padding:5px 0;
  color:var(--ios-text);
  font-size:15px;
}
.route-style-row + .route-style-row::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:.5px;
  background:var(--ios-separator);
}
.route-style-row input[type="range"]{width:100%;}
.route-style-row input[type="color"]{
  width:48px;
  height:32px;
  padding:0;
  border:0;
  border-radius:8px;
  background:transparent;
}
.route-style-value{
  color:var(--ios-secondary);
  font-size:14px;
  text-align:right;
}

/* Label page as a grouped settings card */
#labelPage > .route-style-row{
  padding:5px 14px;
  background:var(--ios-card);
}
#labelPage > .route-style-row:first-child{
  border-radius:var(--ios-radius) var(--ios-radius) 0 0;
}
#labelPage > .route-style-row:nth-child(2){
  margin-top:-16px;
  border-radius:0 0 var(--ios-radius) var(--ios-radius);
}
#labelPage > .row{
  margin-top:0;
  padding:0;
}
.save-style-btn,
.subtle-action{
  width:100%;
  min-height:50px;
  margin:0;
  padding:0 14px;
  border:0;
  border-radius:var(--ios-radius);
  background:var(--ios-card);
  color:var(--ios-blue);
  font-size:15px;
  font-weight:500;
  box-shadow:0 0 0 .5px rgba(60,60,67,.08);
}
.save-style-btn:hover,
.save-style-btn:active,
.subtle-action:hover,
.subtle-action:active{background:#f6f6f8;}

/* Other functions page */
.quick-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:0;
  margin:0;
  overflow:hidden;
  border-radius:var(--ios-radius);
  background:var(--ios-card);
  box-shadow:0 0 0 .5px rgba(60,60,67,.08);
}
.quick-btn{
  position:relative;
  min-height:52px;
  padding:0 14px;
  border:0;
  border-radius:0;
  background:var(--ios-card);
  color:var(--ios-text);
  font-size:15px;
  font-weight:400;
  text-align:left;
}
.quick-btn:not(:last-child)::after{
  content:"";
  position:absolute;
  left:14px;
  right:0;
  bottom:0;
  height:.5px;
  background:var(--ios-separator);
}
.quick-btn.active{
  background:var(--ios-card);
  color:var(--ios-blue);
  font-weight:600;
}
.quick-btn.active::before{
  content:"✓";
  float:right;
  color:var(--ios-blue);
  font-size:18px;
}
.airspace-card{
  min-height:54px;
  padding:0 14px;
  border:0;
  border-radius:var(--ios-radius);
  background:var(--ios-card);
  box-shadow:0 0 0 .5px rgba(60,60,67,.08);
}
.airspace-label strong{font-size:15px;font-weight:400;color:var(--ios-text);}
.airspace-label small{font-size:11px;color:var(--ios-secondary);}
.airspace-card input[type="checkbox"]{
  width:51px;
  height:31px;
  appearance:none;
  -webkit-appearance:none;
  border-radius:16px;
  background:#e9e9ea;
  position:relative;
  transition:.18s ease;
}
.airspace-card input[type="checkbox"]::after{
  content:"";
  position:absolute;
  top:2px;
  left:2px;
  width:27px;
  height:27px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.28);
  transition:.18s ease;
}
.airspace-card input[type="checkbox"]:checked{background:#34c759;}
.airspace-card input[type="checkbox"]:checked::after{transform:translateX(20px);}
.compact-link{
  display:block;
  margin:-12px 4px 0 !important;
  color:var(--ios-blue);
  font-size:12px;
  text-align:right;
  text-decoration:none;
}
.memo-list{
  max-height:190px;
  padding:0;
  border:0;
  border-radius:0;
}
.memo-item{
  min-height:48px;
  padding:8px 0;
  border-radius:0;
  border-bottom:.5px solid var(--ios-separator);
  background:transparent;
}
.memo-item:last-child{border-bottom:0;}
.status{
  margin:-4px 0 0;
  padding:0 4px;
  color:var(--ios-secondary);
  font-size:11px;
  text-align:left;
}

/* Memo dialog follows the same iOS surface language, but stays draggable */
.memo-modal-backdrop{background:rgba(0,0,0,.22);}
.memo-modal{
  width:min(360px,calc(100vw - 32px));
  padding:0;
  overflow:hidden;
  border:0;
  border-radius:18px;
  background:var(--ios-bg);
  box-shadow:0 16px 44px rgba(0,0,0,.24);
}
.memo-modal-title{
  min-height:52px;
  margin:0;
  padding:0 16px;
  display:flex;
  align-items:center;
  background:#e5e5ea;
  color:#1c1c1e;
  font-size:17px;
  font-weight:600;
}
.memo-modal textarea{
  width:calc(100% - 24px);
  min-height:120px;
  margin:12px;
  padding:12px;
  border:.5px solid var(--ios-separator);
  border-radius:12px;
  background:#fff;
  color:var(--ios-text);
  font:inherit;
}
.memo-modal-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:0 12px 12px;
}
.memo-modal-actions button{
  min-height:44px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:var(--ios-blue);
  font-size:15px;
  font-weight:500;
}
.memo-delete-btn{color:#ff3b30 !important;}
.memo-save-btn{background:#007aff !important;color:#fff !important;}

/* Floating launcher */
.mobile-menu-launcher{
  width:46px;
  height:46px;
  min-width:46px;
  border:0;
  border-radius:15px;
  background:rgba(255,255,255,.96);
  box-shadow:0 5px 18px rgba(0,0,0,.18);
  color:#1c1c1e;
  font-size:22px;
  line-height:46px;
}

.current-location-dot{
  width:22px;
  height:22px;
  box-sizing:border-box;
  border:4px solid #fff;
  border-radius:50%;
  background:#0a84ff;
  box-shadow:
    0 1px 4px rgba(0,0,0,.35),
    0 0 0 1px rgba(0,0,0,.10);
  pointer-events:none;
}
@media (max-width:700px){
  .current-location-dot{
    width:24px;
    height:24px;
    border-width:4px;
  }
}

.current-location-marker{
  position:relative;
  width:54px;
  height:54px;
  pointer-events:none;
}
.current-location-heading{
  position:absolute;
  left:50%;
  top:-34px;
  width:42px;
  height:58px;
  opacity:0;
  transform-origin:50% 61px;
  transition:opacity .18s ease, transform .16s linear;
  pointer-events:none;
}
.current-location-heading.visible{
  opacity:1;
}
.current-location-heading::before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  width:0;
  height:0;
  transform:translateX(-50%);
  border-left:19px solid transparent;
  border-right:19px solid transparent;
  border-bottom:58px solid rgba(10,132,255,.16);
  filter:drop-shadow(0 1px 2px rgba(10,132,255,.10));
}
.current-location-dot{
  position:absolute;
  left:50%;
  top:50%;
  width:22px;
  height:22px;
  box-sizing:border-box;
  transform:translate(-50%,-50%);
  border:4px solid #fff;
  border-radius:50%;
  background:#0a84ff;
  box-shadow:
    0 1px 5px rgba(0,0,0,.35),
    0 0 0 1px rgba(0,0,0,.08);
}
.current-location-dot::after{
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:50%;
  border:2px solid rgba(10,132,255,.18);
  opacity:.85;
  animation:currentLocationPulse 2s ease-out infinite;
}
@keyframes currentLocationPulse{
  0%{transform:scale(.72);opacity:.5;}
  70%,100%{transform:scale(1.35);opacity:0;}
}
@media (prefers-reduced-motion:reduce){
  .current-location-dot::after{animation:none;}
  .current-location-heading{transition:none;}
}
@media (max-width:700px){
  .current-location-marker{
    width:58px;
    height:58px;
  }
  .current-location-dot{
    width:24px;
    height:24px;
    border-width:4px;
  }
}

/* Subtle Apple Maps-like current-position blink */
.current-location-dot{
  animation:currentLocationSoftBlink 2.1s ease-in-out infinite;
}
.current-location-dot::after{
  animation:none !important;
  opacity:0 !important;
}
@keyframes currentLocationSoftBlink{
  0%,100%{
    filter:brightness(1);
    box-shadow:
      0 1px 5px rgba(0,0,0,.35),
      0 0 0 1px rgba(0,0,0,.08);
  }
  50%{
    filter:brightness(1.14);

      0 1px 5px rgba(0,0,0,.30),

}
