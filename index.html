          <input id="offRouteColor" type="color" value="#6f7f95">
          <span></span>
        </div>
        <div class="route-style-row">
          <span>투명도</span>
          <input id="offRouteOpacity" type="range" min="0.1" max="1" step="0.1" value="0.5">
          <span id="offRouteOpacityValue" class="route-style-value">50%</span>
        </div>
      </div>
      <button id="resetRouteStatesBtn" class="subtle-action" type="button">켜기·끄기 상태 초기화</button>
    </section>

    <section id="labelStylePage" class="menu-page" data-parent-page="stylePage" data-parent-title="스타일 설정">
      <div class="size-preset-group" data-target="labelSize" aria-label="라벨 크기 빠른 선택">
        <button type="button" data-value="13">작게</button>
        <button type="button" data-value="17">표준</button>
        <button type="button" data-value="21">크게</button>
      </div>
      <div class="route-style-row">
        <span>크기</span>
        <input id="labelSize" type="range" min="8" max="28" step="1" value="13">
        <span id="labelSizeValue" class="route-style-value">13px</span>
      </div>
      <div class="route-style-row">
        <span>색상</span>
        <input id="labelColor" type="color" value="#0d47a1">
        <span></span>
      </div>
      <div class="row">
        <button id="saveLabelStyleBtn" class="save-style-btn" type="button">라벨 설정 저장</button>
      </div>
    </section>

    <section id="memoPage" class="menu-page">
      <div class="memo-page-card memo-settings-card">
        <div id="memoList" class="memo-settings-list"></div>
      </div>
    </section>

    <section id="memoDetailPage" class="menu-page" data-parent-page="memoPage" data-parent-title="메모">
      <div class="memo-detail-card">
        <div class="memo-detail-number" id="memoDetailNumber"></div>
        <textarea id="memoDetailTextarea" class="route-inline-memo-textarea" placeholder="메모를 입력하세요"></textarea>
        <div class="route-inline-memo-actions memo-detail-actions">
          <button id="memoDetailCancelBtn" type="button" class="route-inline-memo-cancel">취소</button>
          <button id="memoDetailDeleteBtn" type="button" class="route-inline-memo-delete">삭제</button>
          <button id="memoDetailSaveBtn" type="button" class="route-inline-memo-save">저장</button>
        </div>
      </div>
    </section>

    <section id="otherPage" class="menu-page">
      <div class="quick-grid improvement-grid">
        <button id="menuLocBtn" class="quick-btn" type="button">현재 위치</button>
        <button id="nearbyRouteBtn" class="quick-btn" type="button">가까운 경로</button>
      </div>

      <div id="nearbyRouteResults" class="nearby-route-results" hidden></div>

      <div class="utility-card">
        <button id="exportSettingsBtn" class="utility-row" type="button">
          <span>설정 내보내기</span><span class="utility-chevron">›</span>
        </button>
        <button id="importSettingsBtn" class="utility-row" type="button">
          <span>설정 가져오기</span><span class="utility-chevron">›</span>
        </button>
        <input id="importSettingsFile" type="file" accept="application/json,.json" hidden>
        <button id="diagnosticBtn" class="utility-row" type="button" aria-expanded="false">
          <span>상태 정보</span><span class="utility-chevron">›</span>
        </button>
        <div id="diagnosticPanel" class="diagnostic-panel" hidden></div>
      </div>

      <label class="airspace-card">
        <span class="airspace-label">
          <span class="geo-swatch" style="background:rgba(110,110,110,.15);border-color:#6e6e6e"></span>
          <span>
            <strong>장애물공역</strong>
            <small id="krAirspaceStatus">드론원스톱 장애물공역</small>
          </span>
        </span>
        <input id="krAirspaceToggle" type="checkbox">
      </label>
      <input class="krAirspaceCategory" type="checkbox" value="obstacle" checked hidden>
      <a class="geo-link compact-link" href="https://drone.onestop.go.kr/common/flightArea" target="_blank" rel="noopener">공식 지도 보기 ↗</a>

      <div class="status" id="status">GeoJSON 불러오는 중...</div>
    </section>
  </div>
  <div id="panelResizeHandle" class="panel-resize-handle" role="separator" aria-orientation="horizontal" aria-label="메뉴 높이 조절"></div>
</div>
