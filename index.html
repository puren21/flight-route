<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>비행경로</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      position:fixed;
      inset:0;
      width:100vw;
      min-width:0;
      max-width:100vw;
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #map {
      position:fixed;
      inset:0;
      width:100vw !important;
      min-width:0 !important;
      max-width:100vw !important;
      height:100dvh !important;
      overflow:hidden;
    }
    .panel { position:absolute; top:16px; left:16px; z-index:10; width:220px; padding:14px; background:rgba(255,255,255,.96); border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.18); }
    .panel h1 { margin:0; font-size:18px; }
    .panel-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }
    .mobile-menu-launcher{
      display:block;
      position:fixed;
      top:calc(env(safe-area-inset-top, 0px) + 10px);
      left:calc(env(safe-area-inset-left, 0px) + 10px);
      z-index:2147483647;
      width:44px;
      height:44px;
      min-width:44px;
      padding:0;
      border:1px solid rgba(0,0,0,.18);
      border-radius:12px;
      background:rgba(255,255,255,.98);
      box-shadow:0 3px 12px rgba(0,0,0,.24);
      font-size:22px;
      line-height:44px;
      text-align:center;
      color:#222;
    }
    .panel-toggle {
      flex:0 0 auto;
      width:34px;
      height:34px;
      padding:0;
      border-radius:8px;
      font-size:18px;
      font-weight:700;
      line-height:1;
    }
    .panel-body { display:block; }
    .route-number-wrap {
      margin: 8px 0 10px;
    }
    .route-number-wrap label {
      display:block;
      font-size:12px;
      color:#555;
      margin-bottom:4px;
    }
    .route-number-select {
      width:100%;
      padding:7px 8px;
      border:1px solid #ccc;
      border-radius:7px;
      background:#fff;
      font-size:13px;
    }
    .route-style-controls {
      margin: 8px 0 10px;
      padding: 9px;
      border: 1px solid #e1e4e8;
      border-radius: 9px;
      background: #fafafa;
    }
    .geo-controls {
      display:grid;
      gap:7px;
      padding-top:6px;
    }
    .geo-controls select,
    .geo-controls button {
      width:100%;
    }
    .geo-toggle-row {
      display:flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      color:#333;
    }
    .geo-toggle-row input { flex:0 0 auto; }
    .geo-swatch {
      width:12px;
      height:12px;
      border-radius:50%;
      border:1px solid rgba(0,0,0,.28);
      flex:0 0 12px;
    }
    .kr-airspace-legend {
      display:grid;
      gap:5px;
      margin-top:4px;
      font-size:11px;
      color:#555;
    }
    .kr-airspace-row {
      display:flex;
      align-items:center;
      gap:7px;
    }
    .kr-airspace-row input { flex:0 0 auto; }
    .geo-note {
      font-size:10px;
      line-height:1.4;
      color:#777;
    }
    .geo-link {
      display:block;
      margin-top:2px;
      font-size:11px;
      color:#0D6EFD;
      text-decoration:none;
    }
    .route-style-title {
      font-size: 12px;
      font-weight: 700;
      color: #444;
      margin-bottom: 7px;
    }
    .style-section-toggle {
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:7px 8px;
      margin-top:6px;
      border:0;
      border-radius:7px;
      background:#f1f3f5;
      font-size:12px;
      font-weight:700;
      color:#333;
      cursor:pointer;
    }
    .style-section-body { display:none; padding-top:2px; }
    .style-section-body.open { display:block; }
    .memo-list {
      margin-top:8px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .memo-empty {
      font-size:12px;
      color:#777;
      padding:6px 2px;
    }
    .memo-item {
      width:100%;
      display:grid;
      grid-template-columns:42px 1fr;
      gap:7px;
      align-items:start;
      padding:7px 8px;
      border:1px solid #e2e5e9;
      border-radius:7px;
      background:#fff;
      text-align:left;
      cursor:pointer;
    }
    .memo-item:hover { background:#f7f8fa; }
    .memo-num {
      font-size:12px;
      font-weight:700;
      color:#0D47A1;
    }
    .memo-text {
      font-size:12px;
      line-height:1.35;
      color:#444;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
    }
    .route-style-row {
      display: grid;
      grid-template-columns: 48px 1fr 44px;
      align-items: center;
      gap: 7px;
      margin-top: 7px;
      font-size: 12px;
      color: #555;
    }
    .route-style-row input[type="range"] {
      width: 100%;
      margin: 0;
    }
    .route-style-row input[type="color"] {
      width: 100%;
      height: 28px;
      padding: 1px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    .route-style-value {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #333;
    }
    .panel.collapsed {
      width:auto;
      min-width:0;
      padding:10px 12px;
    }
    .panel.collapsed .panel-header {
      margin-bottom:0;
    }
    .panel.collapsed .panel-body {
      display:none;
    }
    .panel.collapsed h1 {
      font-size:16px;
    }
    .row { display:flex; gap:8px; margin-top:8px; }
    button { flex:1; border:0; border-radius:8px; padding:9px 10px; background:#f1f3f5; cursor:pointer; font-size:14px; }
    button:hover { background:#e9ecef; }
    button.active { background:#222; color:#fff; }
    .toggle { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; }
    .status { margin-top:10px; font-size:12px; line-height:1.5; color:#555; }
    .floating-location {
      position: absolute;
      right: 14px;
      bottom: 56px;
      z-index: 12;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(0,0,0,.18);
      border-radius: 22px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
      font-size: 20px;
      line-height: 44px;
      text-align: center;
      cursor: pointer;
      color: #222;
    }
    .floating-location:hover { background: #fff; }
    .route-select-popup {
      width: 120px;
      padding: 8px;
      background: rgba(255,255,255,.98);
      border-radius: 10px;
      box-shadow: 0 3px 14px rgba(0,0,0,.28);
      font-size: 13px;
      color: #222;
    }
    .route-select-popup .route-select-title {
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }
    .route-select-popup .route-select-actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .route-select-popup button {
      width:100%;
      flex: 0 0 auto;
      min-height:42px;
      padding: 9px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-weight: 700;
      font-size:14px;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .05s ease;
    }
    .route-select-popup button:active{
      transform:scale(.99);
    }
    .route-toggle-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      min-height:42px;
      padding:4px 2px;
    }
    .route-toggle-label{
      font-size:12px;
      font-weight:700;
      color:#4b5157;
    }
    .route-toggle-switch{
      position:relative;
      width:50px;
      height:30px;
      flex:0 0 50px;
      padding:0;
      border:0;
      border-radius:15px;
      background:#d8dde2;
      cursor:pointer;
      transition:background .18s ease;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
    }
    .route-toggle-switch::after{
      content:"";
      position:absolute;
      top:2px;
      left:2px;
      width:26px;
      height:26px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 1px 4px rgba(0,0,0,.24);
      transition:transform .18s ease;
    }
    .route-toggle-switch.on{
      background:#34c759;
    }
    .route-toggle-switch.on::after{
      transform:translateX(20px);
    }
    .route-select-popup .route-memo-btn {
      background:#f6efe3;
      border-color:#eadfcb;
      color:#705a35;
    }
    .route-select-popup .route-memo-btn:hover{
      background:#efe4d2;
    }
    .route-select-popup .route-prop-btn {
      background:#e7f1ff;
      color:#0D47A1;
    }
    .memo-modal-backdrop {
      position:fixed;
      inset:0;
      z-index:2147483647;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(0,0,0,.35);
    }
    .memo-modal-backdrop.open { display:flex; }
    .memo-modal {
      position:relative;
      width:220px;
      max-width:calc(100vw - 16px);
      overflow:hidden;
      background:#f2f2f7;
      border-radius:18px;
      box-shadow:0 10px 28px rgba(0,0,0,.22);
      padding:0;
    }
    .memo-modal-title {
      margin:0;
      padding:13px 18px;
      min-height:0;
      display:flex;
      align-items:center;
      background:#a6a6a6;
      color:#fff;
      font-size:20px;
      font-weight:600;
      line-height:1.1;
      cursor:grab;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
    }
    .memo-modal-title:active { cursor:grabbing; }
    .memo-modal textarea {
      width:calc(100% - 16px);
      min-height:120px;
      margin:8px 8px 0;
      resize:vertical;
      padding:10px;
      border:0;
      border-radius:16px;
      background:#fff;
      font:inherit;
      font-size:14px;
      line-height:1.45;
      box-sizing:border-box;
      outline:none;
    }
    .memo-modal-actions {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
      padding:8px;
      margin:0;
    }
    .memo-modal-actions button {
      min-height:40px;
      padding:8px 6px;
      border:0;
      border-radius:12px;
      font-size:13px;
      font-weight:600;
    }
    .memo-save-btn { background:#34c759; color:#fff; }
    .memo-delete-btn { background:#fff; color:#c92a2a; }
    .memo-cancel-btn { background:#fff; color:#222; }
    .address-popup {
      width: 250px;
      padding: 12px;
      background: rgba(255,255,255,.98);
      border-radius: 10px;
      box-shadow: 0 3px 14px rgba(0,0,0,.28);
      color: #222;
      font-size: 13px;
      line-height: 1.45;
    }
    .address-popup .title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 5px;
    }
    .address-popup .addr {
      word-break: keep-all;
    }
    .address-popup .coord {
      margin-top: 4px;
      color: #777;
      font-size: 11px;
    }
    .address-popup .route-actions {
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-top:9px;
    }
    .address-popup .route-actions button {
      width:100%;
      margin-top:0;
    }
    .address-popup .navi-btn {
      width: 100%;
      margin-top: 0;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      background: #fee500;
      color: #191919;
      font-weight: 700;
      cursor: pointer;
    }
    .address-popup .naver-btn {
      width: 100%;
      margin-top: 0;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      background: #03c75a;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .address-popup .close-btn {
      position: absolute;
      right: 8px;
      top: 6px;
      border: 0;
      background: transparent;
      padding: 2px 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .scale-bar {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 10;
      min-width: 70px;
      padding: 3px 8px 2px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(0,0,0,.45);
      border-top: 0;
      color: #222;
      font-size: 11px;
      text-align: center;
      line-height: 1.2;
      pointer-events: none;
    }
    .scale-bar::before {
      content: "";
      position: absolute;
      left: -1px;
      right: -1px;
      top: 0;
      border-top: 2px solid #222;
    }
    .route-label {
      color: #0D47A1;
      opacity: 1;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      text-shadow:
        -1px -1px 0 rgba(255,255,255,.95),
         1px -1px 0 rgba(255,255,255,.95),
        -1px  1px 0 rgba(255,255,255,.95),
         1px  1px 0 rgba(255,255,255,.95);
      transform: translate(-50%, -50%);
    }
    @media (min-width:701px) {
      .mobile-menu-launcher { display:none !important; }
    }
    @media (max-width:700px) {
      .mobile-menu-launcher{
        display:block;
        position:fixed;
        top:calc(env(safe-area-inset-top, 0px) + 10px);
        left:10px;
        z-index:2147483647;
      }
      .panel {
        position:fixed;
        top:calc(env(safe-area-inset-top, 0px) + 62px);
        left:10px;
        right:10px;
        width:auto;
        max-width:none;
        max-height:calc(100dvh - env(safe-area-inset-top, 0px) - 80px);
        overflow-y:auto;
        padding:10px;
        z-index:2147483646;
        display:block;
        visibility:visible;
      }
      .panel.collapsed {
        display:none;
      }
      .panel:not(.collapsed) + * { }
      .panel * { min-width:0; }
      .panel h1 { font-size:16px; }
      .route-number-select,
      .route-style-controls,
      .style-section-toggle,
      .memo-list,
      .memo-item,
      .row {
        max-width:100%;
      }
      .memo-text,
      .status {
        overflow-wrap:anywhere;
        word-break:break-word;
      }
      .panel-toggle {
        width:36px;
        height:36px;
        min-width:36px;
      }
      .route-select-popup { max-width:calc(100vw - 24px); }
      .address-popup { max-width:calc(100vw - 24px); }
      .memo-modal { max-width:calc(100vw - 36px); }
      button { padding:8px 6px; font-size:13px; }
      .status { font-size:11px; }
    }
  
    /* unified responsive menu */
    .panel{
      width:320px;
      padding:12px;
      border:1px solid rgba(0,0,0,.08);
      border-radius:16px;
      background:rgba(255,255,255,.97);
      box-shadow:0 10px 30px rgba(0,0,0,.16);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }
    .panel-header{
      margin-bottom:10px;
      padding:2px 2px 8px;
      border-bottom:1px solid #edf0f2;
      cursor:pointer;
    }
    .panel h1{
      font-size:17px;
      letter-spacing:-.3px;
    }
    .panel-toggle{
      background:#f4f5f7;
      border:1px solid #e6e8eb;
    }
    .panel-body{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .menu-section{
      margin:0;
      padding:8px;
      border:1px solid #e7eaee;
      border-radius:12px;
      background:#fff;
    }
    .menu-section-title{
      margin-bottom:8px;
      font-size:12px;
      font-weight:800;
      color:#24292f;
      letter-spacing:-.2px;
    }
    .quick-grid{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:5px;
      margin-bottom:6px;
    }
    .quick-btn{
      min-height:40px;
      padding:8px 5px;
      border:1px solid #e2e5e9;
      background:#f7f8fa;
      font-size:12px;
      font-weight:700;
    }
    .quick-btn.active{
      background:#222;
      border-color:#222;
      color:#fff;
    }
    .airspace-card{
      min-height:46px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:8px 9px;
      border:1px solid #e8eaed;

    .airspace-label{

      align-items:center;

    }
    .airspace-label > span:last-child{
      display:flex;
      flex-direction:column;
      min-width:0;
    }
    .airspace-label strong{
      font-size:12px;
      color:#333;
    }
    .airspace-label small{
      margin-top:2px;
      font-size:10px;
      color:#888;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .airspace-card input{
      width:18px;
      height:18px;
      flex:0 0 auto;
    }
    .compact-link{
      margin:7px 2px 0;
      text-align:right;
    }
    .route-number-wrap{
      margin:0;
    }
    .route-number-wrap label{
      margin-bottom:6px;
      font-size:11px;
      color:#73777d;
    }
    .route-number-select{

      padding:0 10px;
      border-color:#dfe3e7;
      border-radius:9px;
      font-size:13px;
    }
    .style-section-toggle{

      margin-top:4px;

      height:24px;

      background:#eceff2;
      color:#333;
      font-size:19px;
      font-weight:500;
      line-height:1;
    }

      border:1px solid #e2e6ea;

      color:#34383d;
    }

    .main-menu-toggle{
      min-height:42px;
      margin-top:0;
      padding:9px 11px;
      border:1px solid #e1e5e9;
      border-radius:10px;
      background:#f5f6f8;
      color:#2a2e33;
      font-size:13px;
      font-weight:800;
      box-shadow:0 1px 0 rgba(0,0,0,.02);

    .main-menu-toggle:hover{

    }

      padding:2px 2px 2px 8px;

    .style-section-body{
      padding:2px 2px 1px;
    }
    .route-style-row{
      grid-template-columns:50px 1fr 48px;
      gap:7px;
      margin-top:6px;
    }
    .route-style-row input[type="color"]{
      height:32px;
    }
    .save-style-btn{
      min-height:38px;
      background:#222;
      color:#fff;
      font-weight:700;
    }
    .save-style-btn:hover{
      background:#111;
    }
    .subtle-action{
      width:100%;
      min-height:38px;
      margin-top:8px;
      border:1px solid #e6e8eb;
      background:#fff;
      color:#6b7075;
      font-size:11px;
    }
    .memo-item{
      min-height:42px;
      border-radius:9px;
    }
    .status{
      margin:0;
      padding:7px 3px 1px;
      color:#7a7f85;
      font-size:10px;
      text-align:center;
    }
    .panel.collapsed{
      width:auto;
      padding:9px 10px;
      border-radius:12px;
    }

    @media (max-width:700px){

async function loadRemoteMemos(){
  try{
    const response=await fetch(
      SUPABASE_REST_URL+'/route_memos?select=route_number,memo,updated_at',
      {headers:SUPABASE_HEADERS}
    );
    if(!response.ok) throw new Error('메모 불러오기 실패 ('+response.status+')');

    const rows=await response.json();
    const remote={};
    rows.forEach(row=>{
      if(row.route_number===ROUTE_STATE_CLOUD_KEY) return;
      if(row.route_number && row.memo){
        remote[String(row.route_number)]={
          memo:row.memo,
          updated:row.updated_at || ''
        };
      }
    });

    // 온라인 데이터를 기준으로 동기화함.
    // 서버에서 삭제된 메모를 다른 기기의 오래된 localStorage가 다시 살려내지 않도록
    // 원격에 없는 로컬 메모는 자동 재업로드하지 않음.
    const local={...routeMemos};
    const merged={...remote};
    const uploads=[];

    Object.keys(local).forEach(num=>{
      const localItem=local[num];
      const remoteItem=remote[num];
      if(!localItem?.memo || !remoteItem) return;

      const localTime=Date.parse(localItem.updated||'')||0;
      const remoteTime=Date.parse(remoteItem.updated||'')||0;

      // 같은 메모가 서버에도 존재하고 로컬 수정본이 더 최신인 경우에만 업로드함.
      if(localTime>remoteTime){
        merged[num]=localItem;
        uploads.push(upsertRemoteMemo(num,localItem.memo,localItem.updated||new Date().toISOString()));
      }
    });

    if(uploads.length) await Promise.allSettled(uploads);

    routeMemos=merged;
    persistRouteMemos();
    return true;
  }catch(error){
    console.error(error);
    renderMemoList();
    return false;
  }
}

async function upsertRemoteMemo(num,memo,updatedAt){
  const response=await fetch(
    SUPABASE_REST_URL+'/route_memos?on_conflict=route_number',
    {
      method:'POST',
      headers:{
        ...SUPABASE_HEADERS,
        'Prefer':'resolution=merge-duplicates,return=minimal'
      },
      body:JSON.stringify({
        route_number:String(num),
        memo:memo,
        updated_at:updatedAt || new Date().toISOString()
      })
    }
  );
  if(!response.ok){
    const detail=await response.text();
    throw new Error('메모 저장 실패 ('+response.status+'): '+detail);
  }
}

async function deleteRemoteMemo(num){

    {
      method:'DELETE',
      headers:{
        ...SUPABASE_HEADERS,

      }
    }
  );
  if(!response.ok){
    const detail=await response.text();

(function enableMemoModalDrag(){
  const modal=document.querySelector('.memo-modal');
  const handle=document.getElementById('memoModalTitle');
  if(!modal || !handle) return;

  let dragging=false;
  let startX=0, startY=0;
  let startLeft=0, startTop=0;

  const clamp=(v,min,max)=>Math.min(Math.max(v,min),max);

  handle.addEventListener('pointerdown',e=>{
    if(e.button!==undefined && e.button!==0) return;
    const rect=modal.getBoundingClientRect();

    modal.style.position='fixed';
    modal.style.left=rect.left+'px';
    modal.style.top=rect.top+'px';
    modal.style.margin='0';
    modal.style.transform='none';

    dragging=true;
    startX=e.clientX;
    startY=e.clientY;
    startLeft=rect.left;
    startTop=rect.top;

    try{ handle.setPointerCapture?.(e.pointerId); }catch(err){}
    e.preventDefault();
    e.stopPropagation();
  });

  handle.addEventListener('pointermove',e=>{
    if(!dragging) return;

    const maxLeft=Math.max(8,window.innerWidth-modal.offsetWidth-8);
    const maxTop=Math.max(8,window.innerHeight-modal.offsetHeight-8);

    const nextLeft=clamp(startLeft+(e.clientX-startX),8,maxLeft);
    const nextTop=clamp(startTop+(e.clientY-startY),8,maxTop);

    modal.style.left=nextLeft+'px';
    modal.style.top=nextTop+'px';
    e.preventDefault();
    e.stopPropagation();
  });

  const endDrag=e=>{
    if(!dragging) return;
    dragging=false;
    try{ handle.releasePointerCapture?.(e.pointerId); }catch(err){}
    e.stopPropagation();
  };

  handle.addEventListener('pointerup',endDrag);
  handle.addEventListener('pointercancel',endDrag);

  window.addEventListener('resize',()=>{
    if(getComputedStyle(modal).position!=='fixed') return;
    const rect=modal.getBoundingClientRect();
    const maxLeft=Math.max(8,window.innerWidth-modal.offsetWidth-8);
    const maxTop=Math.max(8,window.innerHeight-modal.offsetHeight-8);
    modal.style.left=clamp(rect.left,8,maxLeft)+'px';
    modal.style.top=clamp(rect.top,8,maxTop)+'px';
  });
})();

    if(e){ e.preventDefault(); e.stopPropagation(); }

  };
  toggleSwitch.addEventListener('click',toggleRoute);

  memoBtn.className='route-menu-row route-memo-btn';
  memoBtn.type='button';

  memoLabel.className='route-menu-label';
  memoLabel.textContent='메모추가';

  memoChevron.className='route-menu-chevron';
  memoChevron.textContent='›';

  memoBtn.appendChild(memoLabel);
  memoBtn.appendChild(memoChevron);

  const openMemo=function(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    openMemoEditor(routeLine);
  };
  memoBtn.addEventListener('click',openMemo);

  actions.appendChild(toggleRow);
  actions.appendChild(memoBtn);

  box.appendChild(title);
  box.appendChild(actions);

  routePopupOpenedAt=Date.now();
  routeSelectOverlay=new kakao.maps.CustomOverlay({
    map:map,
    position:position,
    content:box,
    clickable:true,
    xAnchor:0.5,
    yAnchor:1.32,
    zIndex:40
  });

  // 상단 노선번호 영역을 드래그하면 팝업 위치를 지도 위에서 이동함.
  let popupDragPointerId=null;
  let popupDragStartX=0;
  let popupDragStartY=0;
  let popupDragStartPoint=null;

  const stopPopupDrag=()=>{
    popupDragPointerId=null;
    popupDragStartPoint=null;
  };

  title.addEventListener('pointerdown',e=>{
    if(e.button!==undefined && e.button!==0) return;
    if(!routeSelectOverlay) return;

    e.preventDefault();
    e.stopPropagation();
    kakao.maps.event.preventMap();

    box.style.pointerEvents='auto';

    const projection=map.getProjection();
    const overlayPosition=routeSelectOverlay.getPosition();
    popupDragStartPoint=projection.containerPointFromCoords(overlayPosition);
    popupDragPointerId=e.pointerId;
    popupDragStartX=e.clientX;
    popupDragStartY=e.clientY;

    try{ title.setPointerCapture(e.pointerId); }catch(err){}
  });

  title.addEventListener('pointermove',e=>{
    if(popupDragPointerId===null || e.pointerId!==popupDragPointerId || !popupDragStartPoint || !routeSelectOverlay) return;

    e.preventDefault();
    e.stopPropagation();
    kakao.maps.event.preventMap();

    const projection=map.getProjection();
    const nextPoint=new kakao.maps.Point(
      popupDragStartPoint.x+(e.clientX-popupDragStartX),
      popupDragStartPoint.y+(e.clientY-popupDragStartY)
    );
    routeSelectOverlay.setPosition(projection.coordsFromContainerPoint(nextPoint));
  });

  title.addEventListener('pointerup',e=>{
    if(popupDragPointerId!==e.pointerId) return;
    try{ title.releasePointerCapture(e.pointerId); }catch(err){}
    stopPopupDrag();
  });

  title.addEventListener('pointercancel',stopPopupDrag);
}

function isMobileRouteDevice(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints>1 && /Macintosh/i.test(navigator.userAgent));
}

function openAppWithWebFallback(appUrl,webUrl){
  let fallbackTimer=null;
  const cancelFallback=()=>{
    if(document.hidden && fallbackTimer){
      clearTimeout(fallbackTimer);
      fallbackTimer=null;
    }
  };
  document.addEventListener('visibilitychange',cancelFallback,{once:true});
  window.location.href=appUrl;
  fallbackTimer=setTimeout(()=>{
    if(!document.hidden) window.location.href=webUrl;
  },1200);
}

function startKakaoNavi(name,lat,lng){
  const destinationName=encodeURIComponent(name || '선택 위치');
  const webUrl='https://map.kakao.com/link/to/'+destinationName+','+lat+','+lng;

  if(isMobileRouteDevice()){
    if(window.Kakao && Kakao.isInitialized() && Kakao.Navi){
      Kakao.Navi.start({
        name: name || '선택 위치',
        x: lng,
        y: lat,
        coordType: 'wgs84'
      });
      return;
    }

    const appUrl='kakaonavi://navigate?name='+destinationName+
      '&x='+lng+
      '&y='+lat+
      '&coord_type=wgs84';
    openAppWithWebFallback(appUrl,webUrl);
    return;
  }

  window.open(webUrl,'_blank','noopener,noreferrer');
}

function wgs84ToWebMercator(lat,lng){
  const x=lng*20037508.34/180;
  let y=Math.log(Math.tan((90+lat)*Math.PI/360))/(Math.PI/180);
  y=y*20037508.34/180;
  return {x:x,y:y};
}

function startNaverMapRoute(name,lat,lng){
  const rawName=name || '선택 위치';
  const destinationName=encodeURIComponent(rawName);
  const appName=encodeURIComponent(window.location.origin + window.location.pathname);

  if(isMobileRouteDevice()){
    const appUrl='nmap://route/car?dlat='+lat+
      '&dlng='+lng+
      '&dname='+destinationName+
      '&appname='+appName;
    const p=wgs84ToWebMercator(lat,lng);
    const webUrl='https://map.naver.com/p/directions/-/'+
      p.x+','+p.y+','+destinationName+',,ADDRESS_POI/-/car';
    openAppWithWebFallback(appUrl,webUrl);
    return;
  }

  const p=wgs84ToWebMercator(lat,lng);
  const webUrl='https://map.naver.com/p/directions/-/'+
    p.x+','+p.y+','+destinationName+',,ADDRESS_POI/-/car';
  window.open(webUrl,'_blank','noopener,noreferrer');
}

function niceScaleDistance(meters){
  const exponent=Math.pow(10,Math.floor(Math.log10(meters)));
  const fraction=meters/exponent;
  let niceFraction;
  if(fraction>=5) niceFraction=5;
  else if(fraction>=2) niceFraction=2;
  else niceFraction=1;
  return niceFraction*exponent;
}

function updateScaleBar(){
  const scaleBar=document.getElementById('scaleBar');
  if(!scaleBar) return;

  const center=map.getCenter();
  const projection=map.getProjection();
  if(!projection) return;

  const centerPoint=projection.containerPointFromCoords(center);
  const targetPoint=new kakao.maps.Point(centerPoint.x+100,centerPoint.y);
  const targetCoord=projection.coordsFromContainerPoint(targetPoint);

  const line=new kakao.maps.Polyline({path:[center,targetCoord]});
  const meters100px=line.getLength();
  const niceMeters=niceScaleDistance(meters100px);
  const width=Math.max(40,Math.round(100*(niceMeters/meters100px)));

  scaleBar.style.width=width+'px';
  scaleBar.textContent=niceMeters>=1000 ? (niceMeters/1000)+' km' : Math.round(niceMeters)+' m';
}

kakao.maps.event.addListener(map,'zoom_changed',updateScaleBar);
kakao.maps.event.addListener(map,'idle',updateScaleBar);

async function loadRoute(){
  try{
    const response=await fetch('./flight-route.geojson');
    if(!response.ok) throw new Error('GeoJSON 파일을 불러오지 못했습니다.');
    const geojson=await response.json();
    if(!geojson.features||!Array.isArray(geojson.features)) throw new Error('유효한 GeoJSON FeatureCollection이 아닙니다.');
    let lineCount=0;
    geojson.features.forEach(feature=>{
      if(!feature.geometry)return;
      const labelNumber=feature.properties?.num ?? feature.properties?.num1 ?? '';
      if(feature.geometry.type==='LineString'){drawLineString(feature.geometry.coordinates,labelNumber);lineCount++;}
      if(feature.geometry.type==='MultiLineString'){feature.geometry.coordinates.forEach(coords=>{drawLineString(coords,labelNumber);lineCount++;});}
    });
    if(routePolylines.length>0){
      map.setBounds(routeBounds);
      const fittedLevel=map.getLevel();
      map.setLevel(Math.max(1,fittedLevel-1));
    }
    updateRouteLabelVisibility();
    populateRouteNumberMenu();
    statusEl.textContent='비행경로 '+lineCount+'개 선 표시 완료';
  }catch(error){console.error(error);statusEl.textContent='GeoJSON 로딩 오류: '+error.message;}
}
function drawLineString(coordinates,labelNumber){
  const localBounds=new kakao.maps.LatLngBounds();
  const path=coordinates.map(coord=>{
    const latLng=new kakao.maps.LatLng(coord[1],coord[0]);
    routeBounds.extend(latLng);
    localBounds.extend(latLng);
    return latLng;
  });

  const routeLine=new kakao.maps.Polyline({
    map:map,
    path:path,
    strokeWeight:routeStyle.weight,
    strokeColor:routeStyle.color,
    strokeOpacity:routeStyle.opacity,
    strokeStyle:'solid',
    clickable:true,
    zIndex:5
  });

  routeLine._routeNumber=labelNumber!=='' ? String(labelNumber) : '';
  const savedEnabled=routeLine._routeNumber &&
    Object.prototype.hasOwnProperty.call(savedRouteStates,routeLine._routeNumber)
      ? savedRouteStates[routeLine._routeNumber]!==false
      : true;
  routeLine._routeEnabled=savedEnabled;
  if(!savedEnabled){
    routeLine.setOptions({
      strokeWeight:offRouteStyle.weight,
      strokeColor:offRouteStyle.color,
      strokeOpacity:offRouteStyle.opacity
    });
  }

  if(labelNumber!==''){
    const key=String(labelNumber);
    if(!routeIndex.has(key)){
      routeIndex.set(key,{
        bounds:new kakao.maps.LatLngBounds(),
        lines:[]
      });
    }
    const entry=routeIndex.get(key);
    path.forEach(p=>entry.bounds.extend(p));
    entry.lines.push(routeLine);
  }

  // 모바일에서도 쉽게 선택할 수 있도록 같은 경로에 넓은 투명 터치영역을 둠
  const hitLine=new kakao.maps.Polyline({
    map:map,
    path:path,
    strokeWeight:24,
    strokeColor:'#000000',
    strokeOpacity:0.01,
    strokeStyle:'solid',
    clickable:true,
    zIndex:6
  });

  const openRouteMenu=function(mouseEvent){
    const pos=(mouseEvent && mouseEvent.latLng)
      ? mouseEvent.latLng
      : path[Math.floor(path.length/2)];
    showRouteSelectPopup(routeLine,pos);
  };

  kakao.maps.event.addListener(hitLine,'click',openRouteMenu);
  kakao.maps.event.addListener(routeLine,'click',openRouteMenu);

  routeLine._hitLine=hitLine;
  routePolylines.push(routeLine);

  if(labelNumber!=='' && coordinates.length>0){
    const midIndex=Math.floor((coordinates.length-1)/2);
    const mid=coordinates[midIndex];
    const label=document.createElement('div');
    label.className='route-label';
    label.textContent=labelNumber;
    label.style.fontSize=labelStyle.size+'px';
    label.style.color=labelStyle.color;

    const overlay=new kakao.maps.CustomOverlay({
      map:null,
      position:new kakao.maps.LatLng(mid[1],mid[0]),
      content:label,
      xAnchor:0.5,
      yAnchor:0.5,
      zIndex:10
    });

    overlay._labelElement=label;
    routeLine._labelOverlay=overlay;
    routeLabels.push(overlay);
    setRouteState(routeLine,savedEnabled,false);
    updateRouteLabelVisibility();
  }
}

function populateRouteNumberMenu(){
  const select=document.getElementById('routeNumberSelect');
  if(!select) return;

  const current=select.value;
  select.innerHTML='<option value="">번호 선택</option>';

  const nums=[...routeIndex.keys()].sort((a,b)=>{
    const na=Number(a), nb=Number(b);
    if(!Number.isNaN(na) && !Number.isNaN(nb)) return na-nb;
    return a.localeCompare(b,'ko');
  });

  nums.forEach(num=>{
    const option=document.createElement('option');
    option.value=num;
    option.textContent=num;
    select.appendChild(option);
  });

  if(current && routeIndex.has(current)) select.value=current;
}

          line._routeEnabled===false ? String(offRouteStyle.opacity) : String(routeStyle.opacity);

function mercatorToWgs84Point(pt){
  if(!Array.isArray(pt) || pt.length<2) return null;
  const x=Number(pt[0]), y=Number(pt[1]);
  if(!Number.isFinite(x)||!Number.isFinite(y)) return null;

  // 이미 WGS84로 저장된 경우 그대로 사용
  if(Math.abs(x)<=180 && Math.abs(y)<=90){
    return new kakao.maps.LatLng(y,x);
  }

  const max=20037508.34;
  const lon=x/max*180;
  const lat=180/Math.PI*(2*Math.atan(Math.exp((y/max*180)*Math.PI/180))-Math.PI/2);
  return new kakao.maps.LatLng(lat,lon);
}

function airspaceName(props,spec){
  if(!props) return spec.label;
  for(const key of spec.nameFields){
    const v=props[key];
    if(v!==undefined && v!==null && String(v).trim()) return String(v).trim();
  }
  for(const [k,v] of Object.entries(props)){
    if(typeof v==='string' && v.trim() && !v.trim().startsWith('<')) return v.trim();
  }
  return spec.label;
}

function addKoreanAirspaceRing(ring,spec,key,name){
  if(!Array.isArray(ring)) return 0;
  const path=ring.map(mercatorToWgs84Point).filter(Boolean);
  if(path.length<3) return 0;

  const polygon=new kakao.maps.Polygon({
    map:null,
    path:path,
    strokeWeight:2,
    strokeColor:spec.color,
    strokeOpacity:.85,
    strokeStyle:'solid',
    fillColor:spec.color,
    fillOpacity:spec.fillOpacity
  });
  krAirspaceOverlays[key].push(polygon);
  return 1;
}

function renderKoreanAirspaceFeature(feature,spec,key){
  if(!feature?.geometry) return 0;
  const geom=feature.geometry;
  const name=airspaceName(feature.properties,spec);
  let count=0;

  if(geom.type==='Polygon'){
    const outer=geom.coordinates?.[0];
    count+=addKoreanAirspaceRing(outer,spec,key,name);
  }else if(geom.type==='MultiPolygon'){
    (geom.coordinates||[]).forEach(poly=>{
      const outer=poly?.[0];
      count+=addKoreanAirspaceRing(outer,spec,key,name);
    });
  }
  return count;
}

function selectedKoreanAirspaceCategories(){
  return new Set(
    [...document.querySelectorAll('.krAirspaceCategory:checked')].map(el=>el.value)
  );
}

function refreshKoreanAirspaceVisibility(){
  const selected=selectedKoreanAirspaceCategories();
  Object.entries(krAirspaceOverlays).forEach(([key,items])=>{
    const show=krAirspaceEnabled && selected.has(key);
    items.forEach(o=>o.setMap(show?map:null));
  });
}

async function loadKoreanAirspace(){
  const status=document.getElementById('krAirspaceStatus');
  if(krAirspaceLoaded){
    refreshKoreanAirspaceVisibility();
    return;
  }
  if(status) status.textContent='국내 공역 데이터를 불러오는 중...';

  try{
    let polygonCount=0;
    for(const [key,spec] of Object.entries(KR_AIRSPACE_SPECS)){
      const res=await fetch(spec.url,{cache:'no-store'});
      if(!res.ok) throw new Error(spec.label+' HTTP '+res.status);
      const data=await res.json();
      (data.features||[]).forEach(feature=>{
        polygonCount+=renderKoreanAirspaceFeature(feature,spec,key);
      });
    }
    krAirspaceLoaded=true;
    refreshKoreanAirspaceVisibility();
    if(status) status.textContent='국내 공역 '+polygonCount+'개 폴리곤 표시 준비 완료';
  }catch(error){
    console.error('Korean airspace load error',error);
    if(status) status.textContent='국내 공역 데이터를 불러오지 못했습니다.';
  }
}

function normalizeHeading(value){
  const n=Number(value);
  if(!Number.isFinite(n)) return null;
  return ((n%360)+360)%360;
}

function updateLocationHeadingVisual(){
  if(!currentLocationHeadingEl) return;
  const heading=normalizeHeading(currentHeading);
  if(heading===null){
    currentLocationHeadingEl.classList.remove('visible');
    return;
  }

  currentLocationHeadingEl.classList.add('visible');
  currentLocationHeadingEl.style.transform='translateX(-50%) rotate('+heading+'deg)';
}

function distanceMeters(lat1,lng1,lat2,lng2){
  const R=6371000;
  const toRad=v=>v*Math.PI/180;
  const p1=toRad(lat1);
  const p2=toRad(lat2);
  const dp=toRad(lat2-lat1);
  const dl=toRad(lng2-lng1);
  const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function bearingBetween(lat1,lng1,lat2,lng2){
  const toRad=v=>v*Math.PI/180;
  const toDeg=v=>v*180/Math.PI;
  const p1=toRad(lat1);
  const p2=toRad(lat2);
  const dl=toRad(lng2-lng1);

  const y=Math.sin(dl)*Math.cos(p2);
  const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return normalizeHeading(toDeg(Math.atan2(y,x)));
}

function smoothHeading(previous,next){
  const prev=normalizeHeading(previous);
  const target=normalizeHeading(next);
  if(target===null) return prev;
  if(prev===null) return target;

  let delta=((target-prev+540)%360)-180;
  return normalizeHeading(prev+delta*0.35);
}

function ensureCurrentLocationMarker(loc){
  if(currentMarker) return;

  const markerEl=document.createElement('div');
  markerEl.className='current-location-marker';
  markerEl.setAttribute('aria-label','현재 위치');

  const headingEl=document.createElement('div');
  headingEl.className='current-location-heading';

  const dotEl=document.createElement('div');
  dotEl.className='current-location-dot';

  markerEl.appendChild(headingEl);
  markerEl.appendChild(dotEl);

  currentLocationMarkerEl=markerEl;
  currentLocationHeadingEl=headingEl;

  currentMarker=new kakao.maps.CustomOverlay({
    map:map,
    position:loc,
    content:markerEl,
    xAnchor:0.5,
    yAnchor:0.5,
    zIndex:80
  });

  updateLocationHeadingVisual();
}

function animateCurrentLocationTo(loc){
  ensureCurrentLocationMarker(loc);

  if(locationMoveAnimation){
    cancelAnimationFrame(locationMoveAnimation);
    locationMoveAnimation=null;
  }

  const from=currentLocationLatLng || loc;
  const fromLat=from.getLat();
  const fromLng=from.getLng();
  const toLat=loc.getLat();
  const toLng=loc.getLng();
  const duration=650;
  const started=performance.now();

  const ease=t=>1-Math.pow(1-t,3);

  const frame=now=>{
    const p=Math.min(1,(now-started)/duration);
    const ep=ease(p);
    const lat=fromLat+(toLat-fromLat)*ep;
    const lng=fromLng+(toLng-fromLng)*ep;
    const point=new kakao.maps.LatLng(lat,lng);

    currentMarker.setPosition(point);

    if(p<1){
      locationMoveAnimation=requestAnimationFrame(frame);
    }else{
      currentLocationLatLng=loc;
      locationMoveAnimation=null;
    }
  };

  locationMoveAnimation=requestAnimationFrame(frame);
}

function updateCurrentLocationMarker(loc){
  if(!currentLocationLatLng){
    currentLocationLatLng=loc;
    ensureCurrentLocationMarker(loc);
    currentMarker.setPosition(loc);
    return;
  }

  animateCurrentLocationTo(loc);
  currentMarker.setMap(map);
}

function handleDeviceOrientation(event){
  let heading=null;

  if(Number.isFinite(event.webkitCompassHeading)){
    heading=event.webkitCompassHeading;
  }else if(Number.isFinite(event.alpha)){
    heading=360-event.alpha;
  }

  heading=normalizeHeading(heading);
  if(heading===null) return;

  deviceHeading=heading;
  if(currentHeading===null) updateLocationHeadingVisual();
}

async function enableDeviceHeading(){
  if(deviceOrientationListening || typeof DeviceOrientationEvent==='undefined') return;

  try{
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const permission=await DeviceOrientationEvent.requestPermission();
      if(permission!=='granted') return;
    }

    window.addEventListener('deviceorientationabsolute',handleDeviceOrientation,true);
    window.addEventListener('deviceorientation',handleDeviceOrientation,true);
    deviceOrientationListening=true;
  }catch(error){
    console.warn('방향 센서 사용 불가',error);
  }
}

function handleLocationUpdate(position){
  const lat=position.coords.latitude;
  const lng=position.coords.longitude;
  const loc=new kakao.maps.LatLng(lat,lng);

  // 화살표는 휴대폰이 바라보는 방향이 아니라 실제 GPS 이동 궤적을 기준으로 함.
  if(lastMovementPosition){
    const moved=distanceMeters(
      lastMovementPosition.lat,
      lastMovementPosition.lng,
      lat,
      lng
    );

    // GPS 흔들림은 방향으로 취급하지 않음.
    if(moved>=2.5){
      const movementBearing=bearingBetween(
        lastMovementPosition.lat,
        lastMovementPosition.lng,
        lat,
        lng
      );
      currentHeading=smoothHeading(currentHeading,movementBearing);
      lastMovementPosition={lat,lng};
    }
  }else{
    lastMovementPosition={lat,lng};
  }

  updateCurrentLocationMarker(loc);
  updateLocationHeadingVisual();

  // 실제 이동을 따라가되 현재 줌 수준은 유지함.
  if(locationTrackingStarted){
    map.panTo(loc);
  }else{
    map.setCenter(loc);
    map.setLevel(4);
    locationTrackingStarted=true;
  }

  statusEl.textContent='현재 위치 추적 중 · '+lat.toFixed(6)+', '+lng.toFixed(6);
}

function handleLocationError(error){
  console.error(error);

  let message='현재 위치를 가져오지 못했습니다.';
  if(error && error.code===1) message='위치 권한을 허용해 주세요.';
  else if(error && error.code===2) message='현재 위치를 확인할 수 없습니다.';
  else if(error && error.code===3) message='현재 위치 확인 시간이 초과되었습니다.';

  statusEl.textContent=message;
  alert(message);
}

async function locateMe(){
  if(!navigator.geolocation){
    alert('이 브라우저에서는 현재 위치 기능을 사용할 수 없습니다.');
    return;
  }

  // 이미 추적 중이면 새 추적을 만들지 않고 현재 위치로 즉시 복귀함.
  if(locationWatchId!==null){
    if(currentLocationLatLng) map.setCenter(currentLocationLatLng);
    statusEl.textContent='현재 위치 추적 중';
    return;
  }

  statusEl.textContent='현재 위치 확인 중...';
  locationTrackingStarted=false;
  currentHeading=null;
  lastMovementPosition=null;

  locationWatchId=navigator.geolocation.watchPosition(
    handleLocationUpdate,
    handleLocationError,
    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:1000
    }
  );
}
